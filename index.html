<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pack Rip">
<meta name="theme-color" content="#050407">
<title>PACK RIP · Collector</title>
<style>
:root{--gold:#ffd76a;--bg:#050407;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.08);--txt:#f5f2ff;--mut:#8e88a8;--mx:50%;--my:50%;--rx:0deg;--ry:0deg;--c1:#2d63c8;--c2:#0c1f52;--c3:#ffcb05;--bgh:250;--bgs:18%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:none}
img{-webkit-user-drag:none;pointer-events:none}
button{font-family:inherit;cursor:pointer}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(110% 65% at 50% 42%,hsl(var(--bgh) var(--bgs) 17%) 0%,hsl(var(--bgh) calc(var(--bgs) * .8) 7%) 55%,#030305 100%)}
.bgfx::before{content:"";position:absolute;inset:-30%;background:radial-gradient(35% 22% at 30% 35%,hsla(var(--bgh),70%,55%,.10),transparent 70%),radial-gradient(35% 25% at 70% 65%,hsla(calc(var(--bgh) + 30),70%,55%,.08),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(5%,-4%) rotate(8deg)}}
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 80px)}
.screen.on{display:flex}
header.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);min-height:38px;gap:10px;padding-right:118px}
header.top b{color:var(--txt)}
.brand{font-weight:900;letter-spacing:.28em;color:#fff}.brand i{font-style:normal;color:var(--gold)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;margin:0 -16px;padding:0 16px 24px}
@keyframes shine{to{background-position:-250% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
#coin{position:fixed;top:calc(env(safe-area-inset-top) + 9px);right:12px;z-index:35;display:flex;gap:6px;align-items:center;background:rgba(20,18,28,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,215,106,.35);border-radius:30px;padding:7px 13px;font-weight:900;font-size:14px;color:#ffe07a;transition:opacity .3s}
#coin.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
.flyv{position:fixed;z-index:90;font-weight:900;font-size:16px;color:#7dffa8;pointer-events:none;animation:flyup 1.3s forwards;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.flyv.neg{color:#ff8a8a}
@keyframes flyup{to{transform:translateY(-50px);opacity:0}}
.backBtn{border:1px solid var(--line);background:var(--panel);color:#fff;font-size:12px;font-weight:800;letter-spacing:.12em;padding:9px 13px;border-radius:30px}
/* hub */
.hello{margin:10px 0 4px;font-size:28px;font-weight:900;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi b{display:block;font-size:24px;font-weight:900}
.kpi span{font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.pnl.gold{background:linear-gradient(135deg,rgba(255,215,106,.13),rgba(158,240,255,.05));border-color:rgba(255,215,106,.32)}
.pnl.red{background:linear-gradient(135deg,rgba(255,80,80,.16),rgba(255,80,80,.04));border-color:rgba(255,100,100,.35)}
.pnl h4{font-size:10px;letter-spacing:.24em;color:var(--gold);font-weight:800;margin-bottom:6px}
.pnl .big{font-size:16px;font-weight:800}
.pnl p{color:var(--mut);font-size:12px;line-height:1.5;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{border-radius:18px;padding:14px 6px;background:var(--panel);border:1px solid var(--line);color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.tile i{font-style:normal;font-size:26px}
.tile .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
.row2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row2:first-of-type{border-top:0}
.row2 .tx{flex:1;font-size:13px;min-width:0}
.row2 .tx b{display:block}
.row2 .tx small{display:block;color:var(--mut);font-size:11px;margin-top:2px;line-height:1.35}
.row2 .ic{font-size:24px;width:34px;text-align:center;flex:none}
.sbtn{border:0;border-radius:12px;padding:9px 12px;font-weight:900;font-size:11.5px;letter-spacing:.05em;background:linear-gradient(135deg,#fff3c4,#ffd76a 40%,#ff9d2e);color:#160d00;white-space:nowrap;flex:none}
.sbtn.g{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line)}
.sbtn:disabled{opacity:.32}
.th{width:40px;aspect-ratio:63/88;border-radius:4px;object-fit:cover;flex:none;background:#222}
.mbar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb43b,#ffe48a,#9ef0ff)}
.tag{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.1em;padding:2px 6px;border-radius:6px;background:#ffd76a;color:#000;vertical-align:middle;margin-left:4px}
.tag.r{background:#ff3b5c;color:#fff}.tag.b{background:#9ef0ff}.tag.p{background:linear-gradient(90deg,#ffe07a,#ff9de6)}
h3.sec{margin:22px 0 8px;font-size:11px;letter-spacing:.24em;color:var(--mut);text-transform:uppercase}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:24px;line-height:1.6}
/* set list */
.randBtn{margin:14px 0 4px;width:100%;border:0;border-radius:18px;padding:16px;font-weight:900;letter-spacing:.14em;font-size:14px;color:#140c00;background:linear-gradient(135deg,#fff3c4,#ffd76a 40%,#ff9d2e);box-shadow:0 12px 34px rgba(255,170,50,.3)}
.gen{margin:24px 0 12px;display:flex;align-items:baseline;gap:10px}
.gen b{font-size:13px;letter-spacing:.3em;color:#fff}.gen span{font-size:11px;color:var(--mut);letter-spacing:.1em}
.gen::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setT{position:relative;border-radius:18px;padding:14px 12px 12px;min-height:126px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 55%,#000),color-mix(in srgb,var(--b) 70%,#000));display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff}
.setT img{height:44px;max-width:100%;object-fit:contain;object-position:left center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.setT .nm{font-size:13px;font-weight:800;margin-top:8px}
.setT .meta{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.06em;margin-top:2px;display:flex;justify-content:space-between}
.setT .pb{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.setT .pb i{display:block;height:100%;background:linear-gradient(90deg,#ffd76a,#9ef0ff)}
.setT .fb{font-size:20px;font-weight:900;line-height:1.1}
.setT.locked{filter:grayscale(1) brightness(.45);border-style:dashed}
.setT.locked img{opacity:.35}
.setT.next{filter:none;border:1px solid rgba(255,215,106,.55)}
.setT.next img{opacity:.5;filter:grayscale(.6)}
.setT .lk{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:13px}
.setT .req{font-size:9.5px;line-height:1.35;color:rgba(255,255,255,.75);margin-top:6px}
.setT .req b{color:#ffd76a}
.setT .done{position:absolute;top:10px;right:10px;font-size:9px;font-weight:900;letter-spacing:.12em;background:linear-gradient(90deg,#ffe07a,#9ef0ff);color:#000;padding:3px 7px;border-radius:20px}
.setT .own{position:absolute;top:10px;right:10px;font-size:9px;font-weight:900;background:#7dffa8;color:#000;padding:3px 7px;border-radius:20px}
/* open */
#setLogoTop{height:28px;max-width:36vw;object-fit:contain;transition:opacity .3s}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1200px}
#ripText{position:absolute;z-index:3;font-weight:900;font-size:clamp(32px,10vw,48px);line-height:.9;text-align:center;pointer-events:none;top:1%;left:0;right:0;background:linear-gradient(100deg,#fff 0%,#ffe07a 30%,#ff6a3d 55%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite;filter:drop-shadow(0 6px 22px rgba(255,120,60,.45));transform:rotate(-3deg);transition:opacity .35s,transform .35s}
#ripText small{display:block;font-size:11px;letter-spacing:.3em;color:var(--mut);-webkit-text-fill-color:var(--mut);margin-top:10px;font-weight:700}
#packWrap{position:relative;width:min(56vw,260px);aspect-ratio:100/178;transform-style:preserve-3d;margin-top:2%}
#packWrap.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 -7px}50%{translate:0 7px}}
#pack3d{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));touch-action:none}
#packShadow{position:absolute;left:8%;right:8%;bottom:-9%;height:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);filter:blur(6px)}
.art{position:absolute;inset:0;overflow:hidden;border-radius:3px;background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 100%)}
.art .pat{position:absolute;inset:0;opacity:.35;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--c3) 60%,transparent) 0,transparent 40%),repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.07) 0 5deg,transparent 5deg 15deg)}
.art .pat2{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 30%,transparent 70%,rgba(0,0,0,.4))}
.crimp{position:absolute;left:0;right:0;height:8.5%;z-index:3;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1.5px,rgba(255,255,255,.35) 1.5px 3px,transparent 3px 5px),linear-gradient(180deg,#e9edf2 0%,#9aa3ad 22%,#f8fbff 45%,#7d8590 70%,#dfe4ea 100%)}
.crimp.t{top:0}.crimp.b{bottom:0}
.plogo{position:absolute;left:6%;right:6%;top:10.5%;z-index:2}
.plogo svg{width:100%;display:block;overflow:visible}
.tcgline{position:absolute;left:0;right:0;top:22.2%;text-align:center;font-size:clamp(6px,1.9vw,9px);font-weight:900;letter-spacing:.22em;color:#fff;z-index:2}
.tcgline b{background:#c7202a;padding:1px 6px;border-radius:2px;border:1px solid rgba(255,255,255,.6)}
.mascot{position:absolute;left:4%;right:4%;top:25%;height:35%;z-index:2;display:flex;align-items:center;justify-content:center}
.mascot .halo{position:absolute;inset:6% 10%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c3) 70%,#fff) 0%,color-mix(in srgb,var(--c3) 30%,transparent) 45%,transparent 75%)}
.mascot .burst{position:absolute;inset:-10% -5%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.16) 0 4deg,transparent 4deg 14deg);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 80%);mask:radial-gradient(closest-side,#000 20%,transparent 80%)}
.mascot img.a3{position:relative;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.mascot .crop{position:relative;width:86%;aspect-ratio:1/.62;overflow:hidden;-webkit-mask:radial-gradient(closest-side,#000 60%,transparent 100%);mask:radial-gradient(closest-side,#000 60%,transparent 100%)}
.mascot .crop img{width:120.5%;margin-left:-10.24%;margin-top:-17.7%}
.slogo{position:absolute;left:10%;right:10%;top:61%;height:14%;z-index:2;display:flex;align-items:center;justify-content:center}
.slogo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.slogo .tx{font-weight:900;font-size:clamp(14px,5vw,22px);color:var(--c3);text-align:center;text-shadow:0 2px 0 #000}
.ccount{position:absolute;left:0;right:0;bottom:12.5%;text-align:center;z-index:2;font-weight:900;font-size:clamp(7px,2.2vw,10.5px);letter-spacing:.06em;color:var(--c3);text-shadow:0 1px 0 #000}
.ed{position:absolute;right:7%;bottom:17%;z-index:2;width:clamp(16px,5vw,24px);height:clamp(16px,5vw,24px);border-radius:50%;background:#111;color:#fff;font-size:clamp(4px,1.2vw,6px);font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;border:1.5px solid #fff}
.sym{position:absolute;left:7%;bottom:17%;z-index:2;width:clamp(14px,4.4vw,22px);height:clamp(14px,4.4vw,22px);object-fit:contain}
.plastic{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.28) 46%,rgba(200,230,255,.08) 52%,transparent 62%);background-size:260% 260%;background-position:var(--mx) var(--my);mix-blend-mode:screen}
.wrinkle{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.2;mix-blend-mode:overlay;background:repeating-linear-gradient(97deg,rgba(255,255,255,.4) 0 1px,transparent 1px 11px),repeating-linear-gradient(3deg,rgba(0,0,0,.3) 0 1px,transparent 1px 17px)}
.pc{position:absolute;inset:0;will-change:transform,clip-path;contain:layout paint}
#pBody{z-index:2}.strip{z-index:3}.torn{z-index:4}
#tearSpark{position:absolute;z-index:7;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,rgba(255,255,255,.4) 35%,transparent 70%);opacity:0;pointer-events:none}
.hint{position:absolute;left:-4%;right:-4%;height:2px;pointer-events:none;z-index:6;background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 6px,transparent 6px 12px);animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:0}50%{opacity:.8}}
#finger{position:absolute;left:-4%;width:44px;height:44px;margin-top:-22px;border-radius:50%;pointer-events:none;z-index:7;background:radial-gradient(circle,rgba(255,255,255,.95) 0 28%,rgba(255,255,255,.25) 30% 60%,transparent 62%);animation:swipeHint 2.4s ease-in-out infinite}
@keyframes swipeHint{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(min(52vw,240px));opacity:1}100%{transform:translateX(min(52vw,240px));opacity:0}}
#packBar{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .3s}
#packPrice{font-size:12px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;font-weight:700}
#packPrice b{color:#ffe07a}
#packBtns{display:flex;gap:8px}
#weighOut{position:absolute;right:-6%;top:40%;z-index:8;background:#111;border:2px solid #444;border-radius:10px;padding:8px 10px;font:900 18px/1 "SF Mono",Menlo,monospace;color:#7dffa8;text-shadow:0 0 8px #3f9;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#weighOut small{display:block;font:700 8px/1.2 -apple-system,Arial;color:#888;letter-spacing:.2em;margin-bottom:4px}
#loader{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mut);font-size:12px;letter-spacing:.2em}
#loader.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--gold);animation:sp 1s linear infinite}
/* cards */
.cb{position:absolute;inset:0;border-radius:inherit;border:min(2.6vw,11px) solid #1d4fb4;background:radial-gradient(circle at 50% 48%,#fff 0 7.5%,#1a1a1a 8% 10%,transparent 10.5%),radial-gradient(circle at 50% 48%,transparent 0 15%,#1a1a1a 15.5% 17%,transparent 17.5%),linear-gradient(180deg,#e52b2b 0 47%,#1a1a1a 47% 49%,#f4f4f4 49% 100%) 50% 48%/36% 26% no-repeat,radial-gradient(ellipse at 50% 48%,#5aa0ff 0%,#2860c9 30%,#173c8f 60%,#0f2766 100%)}
#reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;perspective:1300px;z-index:4}
#reveal.on{display:flex}
#stack{position:relative;width:min(74vw,330px);aspect-ratio:63/88}
.card{position:absolute;inset:0;border-radius:4.5%/3.2%;transform-style:preserve-3d;will-change:transform;touch-action:none}
.card .face,.card .back{position:absolute;inset:0;border-radius:inherit;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 50px rgba(0,0,0,.6)}
.card .face{background:#ddd}
.card .face img{width:100%;height:100%;object-fit:cover;display:block}
.card .back{transform:rotateY(180deg)}
.card.tease .back{animation:tease 1s ease-in-out infinite}
@keyframes tease{0%,100%{box-shadow:0 0 25px 4px rgba(255,215,106,.55)}50%{box-shadow:0 0 60px 16px rgba(140,220,255,.9)}}
.card.ultraTease .back{animation:tease2 .65s ease-in-out infinite}
@keyframes tease2{0%,100%{box-shadow:0 0 40px 10px rgba(255,60,200,.75)}50%{box-shadow:0 0 100px 30px rgba(255,230,120,1)}}
.foil{position:absolute;pointer-events:none;mix-blend-mode:color-dodge;opacity:.6;background:repeating-linear-gradient(110deg,#ff3b3b 0%,#ffd93b 6%,#3bff7a 12%,#3bd2ff 18%,#a43bff 24%,#ff3b3b 30%);background-size:400% 400%;background-position:var(--mx) var(--my);-webkit-mask:radial-gradient(farthest-corner circle at var(--mx) var(--my),#000 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.2) 90%);mask:radial-gradient(farthest-corner circle at var(--mx) var(--my),#000 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.2) 90%)}
.foil.win{inset:10.5% 8.5% 52% 8.5%}.foil.full{inset:0}.foil.rev{inset:0;opacity:.45}
.sparkle{position:absolute;pointer-events:none;mix-blend-mode:color-dodge;opacity:.75;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 .8px,transparent 1.3px);background-size:19px 23px,13px 11px;background-position:calc(var(--mx) * .3) calc(var(--my) * .2),calc(var(--mx) * -.25) 7px;animation:twinkle 1.6s steps(4) infinite}
@keyframes twinkle{50%{opacity:.25}}
.card.ultra .foil{opacity:.85;background:repeating-linear-gradient(125deg,#ff4fd8 0%,#ffe36a 5%,#6affd5 10%,#6a8bff 15%,#ff4fd8 20%);background-size:400% 400%}
.card.ultra .face{box-shadow:0 0 60px rgba(255,210,110,.75),0 24px 50px rgba(0,0,0,.6)}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(255,255,255,.8) 0%,rgba(255,255,255,.12) 30%,rgba(0,0,0,.3) 90%)}
.badge{position:absolute;top:-11px;right:-9px;z-index:3;background:#ff3b5c;color:#fff;font-size:11px;font-weight:900;letter-spacing:.1em;padding:5px 9px;border-radius:30px;transform:translateZ(30px)}
.badge.mp{background:linear-gradient(90deg,#ff9de6,#ffe07a);color:#000;left:-9px;right:auto}
.rtag{position:absolute;bottom:-34px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--mut);text-transform:uppercase;opacity:0;transition:opacity .3s}
.rtag b{color:#7dffa8;letter-spacing:.05em}
.card.live .rtag{opacity:1}
/* misprints */
.mp-off .face{background:#f2eee2}.mp-off .face img{transform:translate(7%,4.5%)}
.mp-ink .face::after{content:"";position:absolute;width:34%;height:24%;left:38%;top:28%;background:radial-gradient(closest-side,#111 35%,rgba(0,0,0,.6) 60%,transparent 100%);opacity:.85;border-radius:50%;pointer-events:none}
.mp-crimp .face::after{content:"";position:absolute;left:0;right:0;top:40%;height:9%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 2px,rgba(0,0,0,.3) 2px 4px);mix-blend-mode:overlay;pointer-events:none}

.strip2{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;touch-action:pan-x;scrollbar-width:none;flex:none}
.strip2::-webkit-scrollbar{display:none}
.it{flex:none;width:46px;position:relative;border-radius:5px;overflow:hidden;transition:opacity .3s}
.it img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block}
.it .gl{position:absolute;bottom:0;left:0;right:0;font-size:8px;font-weight:900;text-align:center;background:rgba(0,0,0,.75);color:#ffe07a}
.it.sold{opacity:.2}
.it.want{outline:2px solid #7dffa8;outline-offset:1px}
.showTop{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);letter-spacing:.14em;font-weight:700;margin-top:4px;flex:none}
.showTop b{color:#fff}
.buyerArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.av{font-size:70px;line-height:1;animation:walkin .5s cubic-bezier(.2,1.3,.3,1)}
@keyframes walkin{from{transform:translateX(60vw) rotate(10deg);opacity:0}}
.av.leave{animation:walkout .45s forwards}
@keyframes walkout{to{transform:translateX(-70vw) rotate(-10deg);opacity:0}}
.bn{font-weight:900;font-size:18px;margin-top:4px}.bt{color:var(--mut);font-size:10px;letter-spacing:.24em;font-weight:800}
.pati{display:flex;gap:4px;justify-content:center;margin-top:4px}.pati i{width:14px;height:5px;border-radius:3px;background:#7dffa8}.pati i.x{background:rgba(255,255,255,.15)}
.bubble{background:#fff;color:#111;border-radius:18px;padding:11px 14px;font-size:14px;font-weight:600;margin-top:10px;position:relative;max-width:330px;text-align:center;line-height:1.4}
.bubble::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.deal{display:flex;gap:14px;align-items:center;margin-top:12px}
.deal .dimg{width:78px;flex:none}
.deal .dimg img{width:100%;border-radius:5px;display:block}
.deal .dimg .slab{width:78px}
.deal .dtx{font-size:12px;color:var(--mut);line-height:1.5}
.deal .dtx b{color:#fff;font-size:14px;display:block}
.offer{font-size:30px;font-weight:900;color:#7dffa8;line-height:1}
.ctrl{flex:none;padding-top:8px}
.ctrl .two{display:flex;gap:8px}.ctrl .two .btn{flex:1;margin-top:8px;padding:14px 6px;font-size:13px}
.sliderRow{display:flex;align-items:center;gap:10px;margin-top:6px}
.sliderRow input{flex:1;accent-color:#ffd76a;height:30px}
.sliderRow b{min-width:72px;text-align:right;font-size:18px;color:#ffe07a}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick .p{position:relative;border-radius:6px;overflow:hidden;border:2px solid transparent}
.pick .p img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block}
.pick .p.on{border-color:#ffd76a;box-shadow:0 0 14px rgba(255,215,106,.5)}
.pick .p .pv{position:absolute;bottom:0;left:0;right:0;font-size:9px;font-weight:900;text-align:center;background:rgba(0,0,0,.75);color:#7dffa8;padding:2px 0}
.pick .p .ck{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#ffd76a;color:#000;font-weight:900;font-size:12px;display:none;align-items:center;justify-content:center}
.pick .p.on .ck{display:flex}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dl{position:relative;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);padding-bottom:6px;text-align:center}
.dl img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block}
.dl .pr{font-weight:900;color:#ffe07a;font-size:14px;margin-top:5px}
.dl .hv{font-size:9.5px;color:var(--mut);margin-top:1px}
.dl.boughtx{opacity:.25;pointer-events:none}
.dl .box2{aspect-ratio:63/88;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#6a3a1a,#2a160a)}
/* hof */
.wall{margin-top:10px;perspective:900px}
.wallIn{transform:rotateX(6deg);transform-origin:50% 0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;padding:24px 14px 30px;border-radius:14px;background:radial-gradient(60% 40% at 50% 0%,rgba(255,240,200,.18),transparent 70%),repeating-linear-gradient(90deg,#3a2414 0 38px,#331f11 38px 40px);box-shadow:inset 0 0 60px rgba(0,0,0,.7),0 20px 50px rgba(0,0,0,.6)}
.frame{position:relative;padding:7px;background:linear-gradient(135deg,#f1d27a,#9a6d22 45%,#e8c56a 70%,#7a5418);border-radius:4px;box-shadow:0 12px 24px rgba(0,0,0,.65)}
.frame::before{content:"";position:absolute;left:-30%;right:-30%;top:-40px;height:60px;background:radial-gradient(closest-side,rgba(255,240,200,.35),transparent);pointer-events:none}
.frame img{width:100%;display:block;aspect-ratio:63/88;object-fit:cover}
.frame .slab{width:100%}
.frame .pl{position:absolute;left:10%;right:10%;bottom:-20px;background:linear-gradient(#e9cf8a,#b38a3a);color:#2a1a05;font-size:8px;font-weight:900;text-align:center;padding:2px;border-radius:2px;white-space:nowrap;overflow:hidden}
.jobCard{width:min(54vw,230px);aspect-ratio:63/88;margin:16px auto 0;border-radius:8px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6);transition:transform .25s}
.jobCard img{width:100%;height:100%;object-fit:cover}

 {g:2,id:'neo3',n:'Neo Revelation',y:2001,h:198,sm:1.1,c:['#2c5a7a','#0a1a26','#7fd9ff'],ch:['Shining'],ed:1},
 {g:2,id:'neo4',n:'Neo Destiny',y:2002,h:228,sm:1.4,c:['#1d1d3a','#06060f','#c0a2ff'],ch:['Shining'],ed:1},
 {g:2,id:'base6',n:'Legendary Collection',y:2002,h:40,sm:.9,c:['#b8892a','#2a1b04','#fff0b0'],ch:['Charizard']},

 {g:2,id:'ecard2',n:'Aquapolis',y:2003,h:208,sm:1.3,c:['#1d5fb0','#05193a','#8fd0ff'],ch:['Lugia','Kingdra'],e:1},
 {g:2,id:'ecard3',n:'Skyridge',y:2003,h:192,sm:1.5,c:['#3a8ad6','#0a2140','#d2ecff'],ch:['Charizard','Ho-oh','Celebi'],e:1},
 {g:3,id:'ex1',n:'Ruby & Sapphire',y:2003,h:345,sm:.8,c:['#c42a3a','#10224d','#ffd34d'],e:1},
 {g:3,id:'ex2',n:'Sandstorm',y:2003,h:36,sm:.8,c:['#c8913c','#3a2006','#ffe2a3'],e:1},

 {g:3,id:'ex12',n:'Legend Maker',y:2006,h:25,sm:1,c:['#c8682a','#2a1206','#ffd29a'],e:1},
 {g:3,id:'ex13',n:'Holon Phantoms',y:2006,h:222,sm:1.1,c:['#2a5ac8','#06133a','#a8e0ff'],e:1},

 {g:3,id:'ex16',n:'Power Keepers',y:2007,h:245,sm:1,c:['#5a5a6a','#14141c','#d8d8ff'],e:1},
];
const GENS={1:['Generation I','Kanto · 1999–2000'],2:['Generation II','Johto · 2000–2003'],3:['Generation III','Hoenn · 2003–2007']};
const setById={};SETS.forEach(s=>setById[s.id]=s);
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const rr=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const logoURL=id=>`https://images.pokemontcg.io/${id}/logo.png`;

const KEY='packrip_game_v1';
const S0=()=>({coins:60,xp:0,rep:0,packs:0,cards:0,holos:0,ultras:0,gods:0,sinceHolo:0,lastHit:false,
 coll:{},seen:{},nm:{},fakes:{},perSet:{},hist:[],godAt:1+Math.floor(Math.random()*200),

/* =================== CARD DATA =================== */
const CACHE='packrip_cards7_';const memo={};
function rarityTier(r){r=(r||'').toLowerCase();
 if(r&&/(ex|star|secret|shining|ultra|crystal|legend)/.test(r))return 'ultra';
 if(r.includes('holo'))return 'holo';if(r.includes('rare'))return 'rare';if(r.includes('uncommon'))return 'uncommon';return 'common'}
async function fetchJSON(url,ms=15000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
function loadCached(id){if(memo[id])return memo[id];const c=localStorage.getItem(CACHE+id);if(!c)return null;try{return memo[id]=finalize(id,JSON.parse(c))}catch(e){return null}}
async function loadSet(id){
 const m=loadCached(id);if(m)return m;
 let cards=null;
 try{const j=await fetchJSON(`https://api.pokemontcg.io/v2/cards?q=set.id:${id}&pageSize=250&select=id,name,number,rarity,images,supertype,nationalPokedexNumbers,types`,20000);
  cards=j.data.map(c=>({id:c.id,n:c.number,name:c.name,r:rarityTier(c.rarity),s:c.images.small,l:c.images.large,t:c.supertype,dex:(c.nationalPokedexNumbers||[])[0]||0,ty:(c.types||[])[0]||''}));
 }catch(e){
  const j=await fetchJSON(`https://api.tcgdex.net/v2/en/sets/${id}`);const list=(j.cards||[]).filter(c=>c.image);const N=list.length;
  cards=list.map((c,i)=>{const p=i/N;return {id:c.id,n:c.localId,name:c.name,r:p<.14?'holo':p<.25?'rare':p<.5?'uncommon':'common',s:c.image+'/low.webp',l:c.image+'/high.webp',t:'Pokémon',dex:0,ty:''}});
 }

const GRADE_ODDS=[[10,15],[9,30],[8,21],[7,12],[6,7],[5,5],[4,3.5],[3,2.5],[2,2],[1.5,1],[1,1]];
const GRADE_NAME={10:'GEM MT',9:'MINT',8:'NM-MT',7:'NM',6:'EX-MT',5:'EX',4:'VG-EX',3:'VG',2:'GOOD',1.5:'FR',1:'PR'};
const GRADE_LONG={10:'Gem Mint',9:'Mint',8:'Near Mint-Mint',7:'Near Mint',6:'Excellent-Mint',5:'Excellent',4:'Very Good-Excellent',3:'Very Good',2:'Good',1.5:'Fair',1:'Poor'};
const LVL={10:0,9:1,8:2,7:3,6:4,5:5,4:6,3:7,2:8,1.5:9,1:10};
const TIERS=[{k:'std',n:'Standard',fee:15,ms:20*60e3,d:'Back in 20 minutes'},{k:'exp',n:'Express',fee:35,ms:3*60e3,d:'Back in 3 minutes'},{k:'inst',n:'Walk-through',fee:75,ms:0,d:'Graded on the spot'}];
const psaFee=t=>Math.round(t.fee*(hasBadge('thunder')?.75:1)*(S.shop.partner?.85:1));
function rollGrade(){let r=Math.random()*100;for(const [g,w] of GRADE_ODDS){if((r-=w)<0)return g}return 9}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dmgSVG(g,seed){const L=LVL[g],R=mulberry(seed),W=63,H=88;let s='';const q=(a,b)=>a+R()*(b-a);
 const ew=[0,3,5,7,9,12,15,18,22,26,30][L];
 for(let i=0;i<ew;i++){const e=Math.floor(R()*4),len=q(.8,2+L*.6),w=q(.25,.45+L*.08),o=q(.55,.95);
  if(e<2){const x=q(1,W-1),y=e?H-.2:.2;s+=`<line x1="${x}" y1="${y}" x2="${x+len}" y2="${y}" stroke="#fff" stroke-width="${w}" opacity="${o}"/>`}
  else{const y=q(1,H-1),x=e===2?.2:W-.2;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+len}" stroke="#fff" stroke-width="${w}" opacity="${o}"/>`}}
 [[0,0],[W,0],[0,H],[W,H]].slice(0,Math.min(4,L)).forEach(([x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="${q(.8,1.2+L*.35)}" fill="#fff" opacity="${q(.6,.95)}"/>`});
 for(let i=0;i<(L>=3?(L-2)*3:0);i++){const x=q(3,W-3),y=q(3,H-3),a=q(0,Math.PI),l=q(4,10+L*2);s+=`<line x1="${x}" y1="${y}" x2="${x+Math.cos(a)*l}" y2="${y+Math.sin(a)*l}" stroke="#fff" stroke-width="${q(.12,.3)}" opacity="${q(.2,.45)}"/>`}
 for(let i=0;i<[0,0,0,0,0,0,1,1,2,4,5][L];i++){let x1,y1,x2,y2;if(R()<.5){x1=0;x2=W;y1=q(10,H-10);y2=y1+q(-14,14)}else{y1=0;y2=H;x1=q(8,W-8);x2=x1+q(-12,12)}const mx=(x1+x2)/2+q(-3,3),my=(y1+y2)/2+q(-3,3);
  s+=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" stroke="#000" stroke-width=".55" opacity=".38" fill="none"/><path d="M${x1+.35},${y1+.35} Q${mx+.35},${my+.35} ${x2+.35},${y2+.35}" stroke="#fff" stroke-width=".5" opacity=".55" fill="none"/>`}
 for(let i=0;i<(L>=7?L-6:0);i++)s+=`<ellipse cx="${q(8,W-8)}" cy="${q(8,H-8)}" rx="${q(4,10)}" ry="${q(3,8)}" fill="url(#stn${seed})" opacity="${q(.35,.6)}"/>`;
 if(L>=10){const y=q(30,60);s+=`<path d="M${W},${y} l-6,1.5 l-3,-1 l-5,2.2 l-4,-.8" stroke="#2a1a0a" stroke-width=".55" fill="none" opacity=".75"/>`}
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><radialGradient id="stn${seed}"><stop offset="0" stop-color="#7a4a10" stop-opacity=".9"/><stop offset="1" stop-color="#9a6a20" stop-opacity="0"/></radialGradient></defs>${s}</svg>`}
function condStyle(g,seed){const L=LVL[g];
 let st=`filter:${['none','none','none','saturate(.97)','saturate(.92) brightness(.98)','saturate(.86) contrast(.96)','saturate(.8) sepia(.08)','saturate(.72) sepia(.15) contrast(.9)','saturate(.65) sepia(.25) contrast(.88)','saturate(.55) sepia(.32) contrast(.85)','saturate(.5) sepia(.4) contrast(.8) brightness(.95)'][L]};`;
 if(L>=5)st+=`border-radius:${4+L}%/${3+L*.7}%;`;
 if(L>=10){const R=mulberry(seed+7);const a=8+R()*10,b=6+R()*10;st+=`clip-path:polygon(0 0,${100-a}% 0,${100-a+3}% ${b*.4}%,100% ${b}%,100% 100%,0 100%);`}
 return st}
function slabHTML(sl,o={}){const set=setById[setOf(sl.id)],g=sl.grade,L=LVL[g]||0,gl=Math.max(.15,1-L*.09),fk=sl.fake;
 const foil=sl.r==='ultra'?`<div class="foil full" style="opacity:${.85*gl}"></div>`:sl.r==='holo'?`<div class="foil win" style="opacity:${.6*gl}"></div><div class="sparkle" style="inset:10.5% 8.5% 52% 8.5%;opacity:${.7*gl}"></div>`:'';
 const void_=o.void?`<div class="void"><b>COUNTERFEIT</b></div>`:'';
 return `<div class="slab ${g===10&&!o.void?'g10':''} ${fk?'fk':''}"><div class="lab"><div class="logo">${fk?'P.S.A':'PSA'}</div><div class="in"><div class="l"><div>${set.y} POKEMON ${set.n.toUpperCase()}</div><div>${esc(sl.name.toUpperCase())}${sl.r==='holo'||sl.r==='ultra'?'-HOLO':''}</div><div>${o.void?'AUTHENTICATION FAILED':set.ed?'1ST EDITION':'&nbsp;'}</div><div class="bc"></div></div><div class="r"><div>#${sl.n||''}</div><div>${o.void?'N/A':fk?'GEM MNT':GRADE_NAME[g]}</div><div>${o.void?'—':g}</div><div>${sl.cert}</div></div></div></div>
 <div class="well"><div class="sc" style="${o.void?'filter:grayscale(.6) brightness(.8)':condStyle(g,sl.seed)}"><img src="${o.small?sl.s:sl.l}" onerror="if(this.src!=='${sl.s}')this.src='${sl.s}'">${foil}${o.void?'':dmgSVG(g,sl.seed)}<div class="glare" style="opacity:${g===10?1:.6}"></div></div></div>${void_}${o.cover?'<div class="cover">PSA</div>':''}<div class="glass"></div></div>`}

function pickType(){const i=SHOWS.indexOf(SH.show);const boost=1+Math.min(1.5,S.rep/60);
 const w=Object.entries(BT).map(([k,b])=>[k,b.w[i]*((k==='coll'||k==='whale')?boost:1)]);let r=Math.random()*w.reduce((a,x)=>a+x[1],0);for(const [k,v] of w){if((r-=v)<0)return k}return 'coll'}
const gen1=it=>{const s=setById[it.set];return s&&s.g===1};
function wants(type,it){if(it.sold)return 0;const v=it.val;
 switch(type){case 'kid':return v<=22*SH.show.mult&&it.k!=='seal'?(/pikachu/i.test(it.name)?3:1):0;
  case 'flip':return v>=.5?1:0;case 'dad':return gen1(it)?(it.k==='seal'?3:2):(v>=2?.4:0);

function genDealers(){const sh=SH.show,pool={rare:[],holo:[],ultra:[]};unlockedSets().forEach(s=>{const m=memo[s.id];if(m){pool.rare.push(...m.P.rare);pool.holo.push(...m.P.holo);pool.ultra.push(...m.P.ultra)}});
 const out=[];for(let i=0;i<6;i++){const r=Math.random();const tier=r<.06?'ultra':r<.45?'holo':'rare';const c=rnd(pool[tier].length?pool[tier]:pool.rare);if(!c)continue;const v=cardVal(c);
  let price,fake=false,gem=false;const q=Math.random();
  if(q<sh.fake){fake=true;price=v*rr(.3,.5)}else if(q<sh.fake+sh.gem){gem=true;price=v*rr(.35,.55)}else price=v*rr(.88,1.32);
  out.push({c,price:Math.max(.25,Math.round(price*100)/100),fake,gem,bought:false})}
 // mystery box priced from a simulation so it never pays on average
 let sum=0;for(let k=0;k<50;k++)sum+=boxContents(pool).reduce((a,c)=>a+cardVal(c),0);
 SH.box={price:Math.max(3,Math.round(sum/50*1.2)),bought:false,pool};SH.dealers=out}

 h+=`<div class="pnl gold"><h4>👴 GRANDPA'S STORY · CHAPTER ${Math.min(S.story+1,STORY.length)}/${STORY.length}</h4>${st?`<div class="big">${st.t}</div><p>${st.d}</p><div class="row2"><div class="tx"><small>Reward: ${st.rt}</small></div><button class="sbtn" id="stClaim" ${st.ok()?'':'disabled'}>${st.ok()?'CLAIM':'IN PROGRESS'}</button></div>`:'<div class="big">The end… for now</div><p>Grandpa\'s binder is complete. He framed the first page.</p>'}</div>`;
 h+=`<h3 class="sec">Bounties</h3><div class="pnl">${S.bounties.map((b,i)=>`<div class="row2"><img class="th" src="${b.img}"><div class="tx"><b>${esc(b.name)}</b><small>${setById[setOf(b.id)].n} · ${Math.ceil((b.until-NOW())/HOUR)}h left · you have ${rawCount(b.id)}</small></div><button class="sbtn" data-b="${i}" ${rawCount(b.id)?'':'disabled'}>${fmt(b.reward)}</button></div>`).join('')||'<p>No bounties right now. Open a set first.</p>'}</div>`;
 h+=`<h3 class="sec">Collections</h3><div class="pnl">${COLS.map(([n,l,r])=>{const [a,b]=colProgress(l),done=S.cols.includes(n);return `<div class="row2"><div class="tx"><b>${n}</b><small>${l[0]==='pikachu×5'?'5 different Pikachu cards':l.map(x=>x[0].toUpperCase()+x.slice(1)).join(' · ')}</small><div class="mbar"><i style="width:${a/b*100}%"></i></div></div><button class="sbtn ${done?'g':''}" data-col="${n}" ${a>=b&&!done?'':'disabled'}>${done?'✓':`${fmt(r)} + PACK`}</button></div>`}).join('')}</div>`;
 h+=`<h3 class="sec">Achievements · ${S.ach.length}/${ACH.length}</h3><div class="pnl">${ACH.map(([k,n,d,ok,r])=>`<div class="row2" style="${S.ach.includes(k)?'':'opacity:.45'}"><div class="ic">${S.ach.includes(k)?'🏆':'🔒'}</div><div class="tx"><b>${n}</b><small>${d} · ${fmt(r)}</small></div></div>`).join('')}</div>`;
 $('#questBody').innerHTML=h}
$('#questBody').addEventListener('click',e=>{
 if(e.target.id==='stClaim'){const st=STORY[S.story];if(!st||!st.ok())return;const r=st.r;
  if(r.c)addCoins(r.c);if(r.free){S.free+=r.free;toast(`+${r.free} free packs`)}if(r.seal){const s=setById[r.seal];S.sealed.push({uid:uid(),set:s.id,kind:r.kind,packs:18,base:18*packPrice(s),bought:NOW()});toast('Sealed Base Set box added to your Vault')}
  S.story++;addXP(60);save();sfx.holo();burst(120,['#ffe07a','#fff'],1);renderQuests();checkAll();return}
 const b=e.target.closest('[data-b]');if(b){handBounty(+b.dataset.b);return}
 const c=e.target.closest('[data-col]');if(c){const col=COLS.find(x=>x[0]===c.dataset.col);if(S.cols.includes(col[0]))return;S.cols.push(col[0]);addCoins(col[2]);S.free++;addXP(50);save();sfx.holo();toast(`${col[0]} complete · +1 free pack`);renderQuests();checkAll()}});

/* =================== RENDER: GYMS =================== */
async function renderGyms(){$('#gymBody').innerHTML='<div style="display:flex;justify-content:center;padding:40px"><div class="spin"></div></div>';await ensureLoaded();
 $('#gymBody').innerHTML=`<p class="empty" style="padding:10px 4px;text-align:left">Show each Gym Leader a team of 3 of your cards of their type. The team's combined value has to reach their bar. You keep your cards. Every badge gives a permanent bonus.</p>`+
 GYMS.map(([k,n,city,type,need,b,bn,bd,em])=>{const team=gymTeam(type),tot=team.reduce((a,o)=>a+o.v,0),has=hasBadge(b),ok=team.length>=3&&tot>=need;
  return `<div class="pnl ${has?'gold':''}"><div class="row2"><div class="ic">${has?'🏅':em}</div><div class="tx"><b>${n} · ${city}</b><small>${type==='Holo'?'Any holo or ultra rare':type+' type'} · team value ${fmt(need)}+<br>${has?'✓ '+bn+': '+bd:bn+': '+bd}</small></div>${has?'':`<button class="sbtn" data-gym="${k}" ${ok?'':'disabled'}>CHALLENGE</button>`}</div>
  ${has?'':`<div style="display:flex;gap:6px;margin-top:6px">${team.map(o=>`<img class="th" src="${o.c.s}" style="width:44px">`).join('')}<div style="flex:1;font-size:11px;color:var(--mut);align-self:center;text-align:right">${team.length}/3 · ${fmt(tot)}</div></div><div class="mbar"><i style="width:${Math.min(100,tot/need*100)*(team.length/3)}%"></i></div>`}</div>`}).join('')}
$('#gymBody').addEventListener('click',e=>{const b=e.target.closest('[data-gym]');if(!b)return;const g=GYMS.find(x=>x[0]===b.dataset.gym);if(hasBadge(g[5]))return;
 S.badges.push(g[5]);addXP(150);save();flash(1,800);sfx.ultra();burst(260,['#ffe07a','#fff','#9ef0ff'],1.3);
 modal(`<div class="em">${g[8]}</div><h2>${g[6]}!</h2><p>${g[1]}: "Your team is impressive. Take this."<br><b>${g[7]}</b></p><button class="btn" onclick="closeModal()">AWESOME</button>`);renderGyms();checkAll()});

/* =================== RENDER: SHOP =================== */
function bulkInfo(){let n=0,v=0;Object.keys(S.coll).forEach(sid=>{const m=memo[sid];if(!m)return;Object.entries(S.coll[sid]).forEach(([id,c])=>{const card=m.byId[id];if(card&&c>1&&(card.r==='common'||card.r==='uncommon')){n+=c-1;v+=(c-1)*cardVal(card)*.5}})});return {n,v:Math.round(v*100)/100}}
function renderShop(){const bi=bulkInfo();let h=`<div class="pnl"><h4>🧑‍🦳 GARY'S CARD SHOP</h4>
 <div class="row2"><div class="ic">🧹</div><div class="tx"><b>Odd job: sort bulk</b><small>8 cards, $0.50 for each one you sort right. ${jobReady()?'Ready now.':'Back in '+Math.ceil((3*60e3-(NOW()-S.lastJob))/1000)+'s'}</small></div><button class="sbtn" id="job" ${jobReady()?'':'disabled'}>WORK</button></div>
 <div class="row2"><div class="ic">📦</div><div class="tx"><b>Sell bulk duplicates</b><small>${bi.n} spare common/uncommon cards · Gary pays 50%</small></div><button class="sbtn" id="bulk" ${bi.n?'':'disabled'}>${fmt(bi.v)}</button></div>
 ${isBroke()?`<div class="row2"><div class="ic">👴</div><div class="tx"><b>Ask Grandpa for pocket money</b><small>${pocketReady()?'He slips you $12. "Don\'t tell Grandma."':'Grandpa needs a little break. Try again in '+Math.ceil((20*60e3-(NOW()-S.lastPocket))/60e3)+' min.'}</small></div><button class="sbtn" id="pocket" ${pocketReady()?'':'disabled'}>$12</button></div>`:''}</div>`;
 h+=`<h3 class="sec">Sealed product</h3><div class="pnl"><p style="margin-top:0">Sealed product gains value over time (up to +60%). Open it any time, or sell it to dads and whales at card shows.</p>${unlockedSets().map(s=>{const p=packPrice(s),b6=Math.round(6*p*.9),b18=Math.round(18*p*.85);return `<div class="row2"><div class="tx"><b>${s.n}</b><small>Bundle 6 packs · Box 18 packs</small></div><button class="sbtn g" data-buy="${s.id}|bundle|6|${b6}">${fmt(b6)}</button><button class="sbtn" data-buy="${s.id}|box|18|${b18}">${fmt(b18)}</button></div>`}).join('')}</div>`;
 h+=`<h3 class="sec">Your card shop</h3>`;
 if(!S.shop.owned)h+=`<div class="pnl gold"><div class="big">Open your own shop</div><p>Customers buy from your display while you're away. Income piles up for a few hours, then stops until you collect.<br>Needs rank <b>Hobbyist</b>.</p><button class="btn" id="buyShop" ${rankIdx()>=1&&S.coins>=250?'':'disabled'}>SIGN THE LEASE · $250</button></div>`;
 else{const pend=shopPending();h+=`<div class="pnl gold"><div class="row2"><div class="ic">🏪</div><div class="tx"><b>${fmt(shopRate())} per hour</b><small>Fills up for ${shopCap()} hours · ${fmt(pend)} waiting</small></div><button class="sbtn" id="collect" ${pend>=.01?'':'disabled'}>COLLECT</button></div></div><div class="pnl">`+
  Object.entries(UPG).map(([k,u])=>{const lv=S.shop[k],cost=u.c[lv];return `<div class="row2"><div class="tx"><b>${u.n} · level ${lv}/${u.max}</b><small>${u.d}</small></div>${lv>=u.max?'<button class="sbtn g" disabled>MAX</button>':`<button class="sbtn" data-up="${k}">${fmt(cost)}</button>`}</div>`}).join('')+
  `<div class="row2"><div class="tx"><b>Price guide</b><small>See the true market value of every card in the dealer aisles</small></div>${S.shop.guide?'<button class="sbtn g" disabled>OWNED</button>':'<button class="sbtn" data-up="guide">$150</button>'}</div>
  <div class="row2"><div class="tx"><b>PSA partner account</b><small>−15% on every grading fee</small></div>${S.shop.partner?'<button class="sbtn g" disabled>OWNED</button>':'<button class="sbtn" data-up="partner">$250</button>'}</div></div>`}
 $('#shopBody').innerHTML=h}
$('#shopBody').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
 if(t.id==='job'){doJob();return}
 if(t.id==='bulk'){const bi=bulkInfo();Object.keys(S.coll).forEach(sid=>{const m=memo[sid];if(!m)return;Object.entries(S.coll[sid]).forEach(([id,c])=>{const card=m.byId[id];if(card&&c>1&&(card.r==='common'||card.r==='uncommon')){S.coll[sid][id]=1;if((S.fakes[id]||0)>1)S.fakes[id]=1}})});addCoins(bi.v);sfx.cash();save();renderShop();return}
 if(t.id==='pocket'){S.lastPocket=NOW();addCoins(12);save();renderShop();return}
 if(t.id==='buyShop'){if(!spend(250))return;Object.assign(S.shop,{owned:true,disp:1,last:NOW()});addXP(100);save();sfx.ultra();burst(200,['#ffe07a','#fff'],1.2);renderShop();checkAll();return}
 if(t.id==='collect'){const p=shopPending();S.shop.last=NOW();addCoins(p);sfx.cash();save();renderShop();return}
 if(t.dataset.up){const k=t.dataset.up;if(k==='guide'||k==='partner'){if(!spend(k==='guide'?150:250))return;S.shop[k]=true}else{const pend=shopPending();const cost=UPG[k].c[S.shop[k]];if(!spend(cost))return;if(pend>=.01)addCoins(pend);S.shop.last=NOW();S.shop[k]++}save();sfx.holo();renderShop();return}
 if(t.dataset.buy){const [sid,kind,packs,price]=t.dataset.buy.split('|');if(!spend(+price))return;S.sealed.push({uid:uid(),set:sid,kind,packs:+packs,base:+price,bought:NOW()});save();sfx.cash();toast('Sealed '+kind+' added to your Vault');return}});

/* =================== RENDER: MARKET =================== */
async function renderMarket(){$('#marketBody').innerHTML='<div style="display:flex;justify-content:center;padding:40px"><div class="spin"></div></div>';await ensureLoaded();
 const hot=[...hotIds()].map(cardById).filter(Boolean);const items=allItems().sort((a,b)=>b.val-a.val).slice(0,15);
 $('#marketBody').innerHTML=`<div class="pnl ${crashToday()?'red':'gold'}"><h4>${crashToday()?'📉 CRASH DAY':'📈 MARKET OPEN'}</h4><p>${crashToday()?'Prices are 30% lower everywhere today.':'Prices drift a little every day. Hot cards trade at about 1.8× for 24 hours.'}</p></div>
 <h3 class="sec">🔥 Hot today</h3><div class="pnl">${hot.map(c=>`<div class="row2"><img class="th" src="${c.s}"><div class="tx"><b>${esc(c.name)}</b><small>${setById[setOf(c.id)].n} · you have ${rawCount(c.id)}</small></div><b style="color:#7dffa8">${fmt(cardVal(c))}</b></div>`).join('')||'<p>Open some sets to see the market.</p>'}</div>
 <h3 class="sec">Your most valuable items</h3><div class="pnl">${items.map((it,i)=>`<div class="row2"><img class="th" src="${it.img}" style="${it.k==='seal'?'object-fit:contain;background:#222':''}"><div class="tx"><b>${esc(it.name)}${it.k==='slab'?' <span class="tag">PSA '+it.grade+'</span>':it.k==='mis'?' <span class="tag p">ERROR</span>':''}${it.cnt>1?' ×'+it.cnt:''}</b><small>Market ${fmt(it.val)}</small></div>${it.k==='seal'?'':`<button class="sbtn g" data-qs="${i}">SELL ${fmt(it.val*.45)}</button>`}</div>`).join('')||'<p>Nothing yet.</p>'}</div>
 <p class="empty" style="font-size:11px">Quick sell pays 45% of market. Card shows pay much more if you can haggle.</p>`;
 $('#marketBody').querySelectorAll('[data-qs]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.qs];modal(`<h2>Quick sell?</h2><p><b>${esc(it.name)}</b><br>Gary pays <b>${fmt(it.val*.45)}</b> (market ${fmt(it.val)}).</p><button class="btn" id="qsY">SELL</button><button class="btn ghost" onclick="closeModal()">KEEP</button>`);$('#qsY').onclick=()=>{closeModal();quickSell(it);renderMarket()}})}

/* =================== RENDER: HOF / STATS =================== */
function renderHof(){const items=allItems().filter(i=>i.k!=='seal').sort((a,b)=>b.val-a.val).slice(0,9);
 $('#hofBody').innerHTML=items.length?`<p class="empty" style="padding:10px 4px">Your 9 most valuable pieces, framed. Worth <b style="color:#7dffa8">${fmt(items.reduce((a,i)=>a+i.val,0))}</b> together.</p><div class="wall"><div class="wallIn">${items.map(it=>`<div class="frame">${it.k==='slab'?slabHTML(it.sl,{small:1}):`<img src="${it.img}" class="${it.k==='mis'?'':''}">`}<div class="pl">${esc(it.name)} · ${fmt(it.val)}</div></div>`).join('')}</div></div>`:'<p class="empty">Your wall is empty. Pull something worth framing.</p>'}
function renderStats(){let own=0;Object.values(S.coll).forEach(s=>Object.values(s).forEach(n=>own+=n));
 const st=[[S.packs,'Packs ripped'],[S.cards,'Cards pulled'],[own,'Cards in hand'],[S.holos,'Holos'],[S.ultras,'Ultra rares'],[S.gods,'God packs'],[S.stats.mis,'Misprints'],[S.sinceHolo,'Packs since holo'],
  [S.stats.sold,'Items sold'],[fmt(S.stats.earned),'Show earnings'],[S.stats.graded,'PSA subs'],[S.slabs.filter(s=>s.grade===10&&!s.fake).length,'PSA 10s'],[S.stats.scams,'Scams spotted'],[unlockedSets().length+'/'+SETS.length,'Sets unlocked']];
 $('#statsBody').innerHTML=`<div class="sgrid">${st.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
 <h3 class="sec">Best pulls</h3>${S.hist.length?S.hist.slice(0,12).map(h=>`<div class="pnl" style="margin-top:8px"><div class="row2"><img class="th" src="${h.img}"><div class="tx"><b>${esc(h.name)}</b><small>${setById[h.set].n} · Pack #${h.p} · ${tierName[h.r]}${h.god?' · GOD PACK':''}</small></div></div></div>`).join(''):'<p class="empty">No holos yet.</p>'}
 <h3 class="sec">Rules of the game</h3><div class="odds">Packs: <b>10 cards</b>, no duplicates inside one pack. Rare slot: <b>12.5% holo</b>, <b>1% ultra rare</b>. One <b>God Pack</b> in every 200. Misprints: about 1 in 170 cards.<br>
 Pack prices are set so that ripping loses a little on average, like in real life. You make money by <b>haggling at card shows</b>, <b>hunting dealer bargains</b>, <b>grading</b>, <b>bounties</b>, <b>quests</b> and your <b>shop</b>.<br>
 You can't go broke: daily allowance, free daily pack, odd jobs at Gary's and Grandpa's pocket money are always there.<br>
 PSA grades are final. Standard 20 min, Express 3 min, Walk-through instantly.</div>
 <button class="btn ghost" id="resetBtn">RESET EVERYTHING</button>`;
 $('#resetBtn').onclick=()=>{if(confirm('Really delete your whole save?')){localStorage.removeItem(KEY);location.reload()}}}

/* =================== NAV / BOOT =================== */
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
 const tab=id==='scrOpen'?'scrSets':['scrQuests','scrShop','scrMarket','scrGyms','scrHof','scrStats'].includes(id)?'scrHome':id;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===tab));
 if(id!=='scrOpen'){const r=document.documentElement.style;r.setProperty('--bgh',250);r.setProperty('--bgs','18%')}
 ({scrHome:renderHome,scrSets:renderSets,scrAlbum:renderAlbum,scrVault:renderVault,scrShow:()=>{if(!SH)renderShowList()},scrQuests:renderQuests,scrShop:renderShop,scrMarket:renderMarket,scrGyms:renderGyms,scrHof:renderHof,scrStats:renderStats}[id]||(()=>{}))()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>go('scrHome'));
document.addEventListener('gesturestart',e=>e.preventDefault());
function boot(){
 SETS.forEach(s=>loadCached(s.id));rollDaily();updCoin();
 if(S.lastDay!==dayKey()){const first=!S.lastDay;const al=first?0:15+(hasBadge('cascade')?5:0);S.lastDay=dayKey();S.free+=1;if(al)S.coins+=al;save();updCoin();
  setTimeout(()=>modal(first?`<div class="em">👴</div><h2>Welcome, collector</h2><p>Grandpa found his old binder from 1999 and wants your help finishing it.<br><br>You start with <b>$60</b> and <b>1 free pack</b>. Rip Base Set, complete it to unlock the next set, sell at card shows, grade your hits and build a legendary collection.</p><button class="btn" onclick="closeModal();go('scrSets')">LET'S RIP</button>`
   :`<div class="em">☀️</div><h2>Daily bonus</h2><p>+<b>${fmt(al)}</b> allowance and <b>1 free pack</b>.<br>New daily missions are up.</p><button class="btn" onclick="closeModal()">NICE</button>`),500)}
 renderHome();checkSubs();checkAll();
 unlockedSets().forEach(s=>{if(!memo[s.id])loadSet(s.id).then(()=>{save();if($('#scrHome').classList.contains('on'))renderHome()}).catch(()=>{})})}
boot();

</script>
</body>
</html>
