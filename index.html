<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pack Rip">
<meta name="theme-color" content="#080a18">
<title>PACK RIP · Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--gold:#f8d030;--bg:#080a18;--panel:#14183a;--line:#f0f0f0;--txt:#f8f8f8;--mut:#a8b0d8;--grn:#48c060;--red:#e04848;--mx:50%;--my:50%;--rx:0deg;--ry:0deg;--c1:#2d63c8;--c2:#0c1f52;--c3:#ffcb05;--bgh:230;--bgs:30%;--P:'Press Start 2P',monospace;--B:'VT323',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--B);font-size:20px;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:none}
body{touch-action:none}
img{-webkit-user-drag:none;pointer-events:none}
button,input{font-family:inherit;cursor:pointer;color:inherit}
.P{font-family:var(--P)}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:hsl(var(--bgh) var(--bgs) 9%)}
.bgfx::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),radial-gradient(70% 45% at 50% 40%,hsla(var(--bgh),60%,45%,.35),transparent 75%)}
.bgfx::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25% 75%,rgba(255,255,255,.025) 75%) 0 0/16px 16px}
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px)}
.screen.on{display:flex}
header.top{display:flex;justify-content:space-between;align-items:center;font-family:var(--P);font-size:9px;letter-spacing:.06em;color:var(--mut);min-height:40px;gap:8px;padding-right:118px;text-transform:uppercase}
header.top b{color:var(--txt);font-weight:400}
.brand{color:#fff}.brand i{font-style:normal;color:var(--gold)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;margin:0 -14px;padding:2px 14px 24px}
@keyframes shine{to{background-position:-250% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
/* pixel boxes */
.px,.pnl,.kpi,.stat,.odds,.opt,.mbox,.tile,.setT,.dl,.track .row{border:3px solid #f0f0f0;box-shadow:0 0 0 3px #101020,inset 0 0 0 2px #101020,5px 5px 0 3px rgba(0,0,0,.45);border-radius:0}
#coin{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:35;display:flex;align-items:center;background:#101830;border:3px solid #f0f0f0;box-shadow:0 0 0 3px #101020;padding:7px 9px;font-family:var(--P);font-size:10px;color:var(--gold);transition:opacity .3s}
#coin.bump{animation:bump .4s steps(3)}
@keyframes bump{40%{transform:scale(1.2)}}
.flyv{position:fixed;z-index:99;font-family:var(--P);font-size:11px;color:#68e888;pointer-events:none;animation:flyup 1.2s steps(8) forwards;text-shadow:2px 2px 0 #000}
.flyv.neg{color:#ff7070}
@keyframes flyup{to{transform:translateY(-44px);opacity:0}}
.backBtn{border:3px solid #f0f0f0;background:#101830;box-shadow:0 0 0 3px #101020;color:#fff;font-family:var(--P);font-size:8px;padding:8px 9px}
/* buttons */
.btn{appearance:none;border:3px solid #101020;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),0 0 0 3px #f0f0f0,5px 5px 0 3px rgba(0,0,0,.45);padding:15px 10px;font-family:var(--P);font-size:11px;letter-spacing:.04em;color:#101020;background:var(--gold);margin-top:16px;width:100%;line-height:1.5}
.btn:active,.sbtn:active{transform:translate(2px,2px)}
.btn.ghost{background:#202850;color:#fff}
.btn.buy,.sbtn.buy{background:var(--red);color:#fff}
.btn.earn,.sbtn.earn{background:var(--grn);color:#fff}
.btn:disabled,.sbtn:disabled,.opt:disabled{opacity:.35;filter:grayscale(.6)}
.sbtn{border:3px solid #101020;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.3),0 0 0 2px #f0f0f0;padding:8px 8px;font-family:var(--P);font-size:8px;background:var(--gold);color:#101020;white-space:nowrap;flex:none;line-height:1.4}
.sbtn.g{background:#202850;color:#fff}
.money{font-family:var(--P);font-size:9px}
.money.in{color:#68e888}.money.out{color:#ff8080}
/* hub */
.trainer{display:flex;align-items:center;gap:12px;margin-top:6px}
.trainer .spr{width:64px;height:64px;flex:none;background:#f8f8f8;border:3px solid #101020;box-shadow:0 0 0 3px #f0f0f0;display:flex;align-items:flex-end;justify-content:center}
.trainer .tn{font-family:var(--P);font-size:13px}
.trainer .tr{font-family:var(--P);font-size:8px;color:var(--gold);margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.kpi{background:var(--panel);padding:12px}
.kpi b{display:block;font-family:var(--P);font-size:14px;font-weight:400}
.kpi span{font-size:17px;color:var(--mut)}
.pnl{background:var(--panel);padding:12px;margin-top:16px}
.pnl.gold{background:#2a2a10}
.pnl.red{background:#3a1218}
.pnl.grn{background:#10301a}
.pnl h4{font-family:var(--P);font-size:8px;color:var(--gold);font-weight:400;margin-bottom:8px;line-height:1.5}
.pnl .big{font-family:var(--P);font-size:11px;line-height:1.5}
.pnl p{color:var(--mut);font-size:18px;line-height:1.15;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.tile{padding:12px 4px;background:var(--panel);color:#fff;font-family:var(--P);font-size:7px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;text-align:center}
.tile i{font-style:normal;font-size:26px;font-family:initial}
.tile .dot,.tile .lockd{position:absolute;top:5px;right:5px;width:9px;height:9px;background:var(--red);border:2px solid #101020}
.tile.off{opacity:.45}
.row2{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed rgba(255,255,255,.12)}
.row2:first-of-type{border-top:0}
.row2 .tx{flex:1;font-size:19px;min-width:0;line-height:1.05}
.row2 .tx b{display:block;font-weight:400;color:#fff}
.row2 .tx small{display:block;color:var(--mut);font-size:16px;margin-top:2px;line-height:1.05}
.row2 .ic{font-size:24px;width:34px;text-align:center;flex:none}
.th{width:40px;aspect-ratio:63/88;object-fit:cover;flex:none;background:#222;border:2px solid #101020}
.mbar{height:8px;background:#0a0c20;border:2px solid #f0f0f0;margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#68e888 0 6px,#48c060 6px 8px)}
.xpbar i{background:repeating-linear-gradient(90deg,#58a8f8 0 6px,#3878d8 6px 8px)}
.tag{display:inline-block;font-family:var(--P);font-size:7px;padding:3px 4px;background:var(--gold);color:#000;vertical-align:middle;margin-left:4px}
.tag.r{background:var(--red);color:#fff}.tag.p{background:#f088c8}
h3.sec{margin:24px 0 6px;font-family:var(--P);font-size:8px;color:var(--mut);font-weight:400;text-transform:uppercase}
.empty{color:var(--mut);font-size:18px;text-align:center;padding:20px;line-height:1.15}
/* sets */
.randBtn{margin:12px 0 4px}
.gen{margin:26px 0 14px;display:flex;align-items:baseline;gap:10px}
.gen b{font-family:var(--P);font-size:10px;font-weight:400}.gen span{font-size:16px;color:var(--mut)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.setT{position:relative;padding:12px 10px 10px;min-height:124px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 60%,#000),color-mix(in srgb,var(--b) 75%,#000));display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff}
.setT img{height:42px;max-width:100%;object-fit:contain;object-position:left center;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.6))}
.setT .nm{font-family:var(--P);font-size:8px;line-height:1.4;margin-top:8px}
.setT .meta{font-size:16px;color:rgba(255,255,255,.8);margin-top:3px;display:flex;justify-content:space-between}
.setT .pb{height:6px;background:rgba(0,0,0,.5);margin-top:6px;border:1px solid #fff}
.setT .pb i{display:block;height:100%;background:#68e888}
.setT .fb{font-family:var(--P);font-size:12px;line-height:1.3}
.setT.locked{filter:grayscale(1) brightness(.45)}
.setT.next{filter:none}
.setT.next img{opacity:.5;filter:grayscale(.6)}
.setT .lk{position:absolute;top:8px;right:8px;font-size:15px}
.setT .req{font-size:15px;line-height:1.05;color:rgba(255,255,255,.85);margin-top:6px}
.setT .req b{color:var(--gold);font-weight:400}
.setT .done,.setT .own{position:absolute;top:8px;right:8px;font-family:var(--P);font-size:6px;background:var(--gold);color:#000;padding:3px 4px}
.setT .own{background:#68e888}
/* open */
#setLogoTop{height:28px;max-width:34vw;object-fit:contain;transition:opacity .3s}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1200px;flex-direction:column}
#ripText{position:absolute;z-index:3;font-family:var(--P);font-size:clamp(18px,6vw,26px);line-height:1.1;text-align:center;pointer-events:none;top:0;left:0;right:0;color:var(--gold);text-shadow:3px 3px 0 #2050a0,-1px -1px 0 #2050a0,1px -1px 0 #2050a0,-1px 1px 0 #2050a0,5px 5px 0 #000;transition:opacity .3s;animation:bob 1.2s steps(2) infinite}
#ripText small{display:block;font-size:8px;color:#fff;text-shadow:2px 2px 0 #000;margin-top:10px}
@keyframes bob{50%{transform:translateY(-3px)}}
#packWrap{position:relative;width:min(48vw,220px);aspect-ratio:100/178;transform-style:preserve-3d;margin-top:-30px}
#packWrap.float{animation:float 2.4s steps(6) infinite}
@keyframes float{0%,100%{translate:0 -6px}50%{translate:0 6px}}
#pack3d{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));touch-action:none}
#packShadow{position:absolute;left:10%;right:10%;bottom:-8%;height:5%;background:rgba(0,0,0,.6)}
.art{position:absolute;inset:0;overflow:hidden;border-radius:2px;background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 100%)}
.art .pat{position:absolute;inset:0;opacity:.35;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--c3) 60%,transparent) 0,transparent 40%),repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.07) 0 5deg,transparent 5deg 15deg)}
.art .pat2{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 30%,transparent 70%,rgba(0,0,0,.4))}
.crimp{position:absolute;left:0;right:0;height:8.5%;z-index:3;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1.5px,rgba(255,255,255,.35) 1.5px 3px,transparent 3px 5px),linear-gradient(180deg,#e9edf2 0%,#9aa3ad 22%,#f8fbff 45%,#7d8590 70%,#dfe4ea 100%)}
.crimp.t{top:0}.crimp.b{bottom:0}
.plogo{position:absolute;left:6%;right:6%;top:10.5%;z-index:2}
.plogo svg{width:100%;display:block;overflow:visible}
.tcgline{position:absolute;left:0;right:0;top:22.2%;text-align:center;font-family:var(--P);font-size:clamp(4px,1.3vw,6px);color:#fff;z-index:2}
.tcgline b{background:#c7202a;padding:1px 4px;font-weight:400}
.mascot{position:absolute;left:4%;right:4%;top:25%;height:35%;z-index:2;display:flex;align-items:center;justify-content:center}
.mascot .halo{position:absolute;inset:6% 10%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c3) 70%,#fff) 0%,color-mix(in srgb,var(--c3) 30%,transparent) 45%,transparent 75%)}
.mascot .burst{position:absolute;inset:-10% -5%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.16) 0 4deg,transparent 4deg 14deg);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 80%);mask:radial-gradient(closest-side,#000 20%,transparent 80%)}
.mascot img.a3{position:relative;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
.mascot .crop{position:relative;width:86%;aspect-ratio:1/.62;overflow:hidden}
.mascot .crop img{width:120.5%;margin-left:-10.24%;margin-top:-17.7%}
.slogo{position:absolute;left:10%;right:10%;top:61%;height:14%;z-index:2;display:flex;align-items:center;justify-content:center}
.slogo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.8))}
.slogo .tx{font-family:var(--P);font-size:clamp(7px,2.4vw,11px);color:var(--c3);text-align:center;text-shadow:2px 2px 0 #000;line-height:1.3}
.ccount{position:absolute;left:0;right:0;bottom:12.5%;text-align:center;z-index:2;font-family:var(--P);font-size:clamp(4px,1.3vw,6px);color:var(--c3);text-shadow:1px 1px 0 #000}
.ed{position:absolute;right:7%;bottom:17%;z-index:2;width:clamp(14px,4.5vw,22px);height:clamp(14px,4.5vw,22px);border-radius:50%;background:#111;color:#fff;font-size:clamp(4px,1.1vw,6px);font-family:Arial;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;border:1.5px solid #fff}
.sym{position:absolute;left:7%;bottom:17%;z-index:2;width:clamp(12px,4vw,20px);height:clamp(12px,4vw,20px);object-fit:contain}
.plastic{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.28) 46%,rgba(200,230,255,.08) 52%,transparent 62%);background-size:260% 260%;background-position:var(--mx) var(--my);mix-blend-mode:screen}
.wrinkle{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.2;mix-blend-mode:overlay;background:repeating-linear-gradient(97deg,rgba(255,255,255,.4) 0 1px,transparent 1px 11px),repeating-linear-gradient(3deg,rgba(0,0,0,.3) 0 1px,transparent 1px 17px)}
.pc{position:absolute;inset:0;will-change:transform,clip-path;contain:layout paint}
#pBody{z-index:2}.strip{z-index:3}.torn{z-index:4}
#tearSpark{position:absolute;z-index:7;width:14px;height:14px;margin:-7px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.4);opacity:0;pointer-events:none}
.hint{position:absolute;left:-4%;right:-4%;height:3px;pointer-events:none;z-index:6;background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 12px);animation:blink 1s steps(1) infinite}
#finger{position:absolute;left:-4%;width:22px;height:22px;margin-top:-11px;pointer-events:none;z-index:7;background:#fff;border:3px solid #101020;animation:swipeHint 2.4s steps(12) infinite}
@keyframes swipeHint{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(min(46vw,210px));opacity:1}100%{transform:translateX(min(46vw,210px));opacity:0}}
#packBar{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .3s}
#scaleBox{display:none;align-items:center;gap:10px;background:#0a1a0e;border:3px solid #f0f0f0;box-shadow:0 0 0 3px #101020,5px 5px 0 3px rgba(0,0,0,.45);padding:8px 12px}
#scaleBox.on{display:flex;animation:pop .3s steps(3)}
#scaleBox .rd{font-family:var(--P);font-size:16px;color:#68ff88;text-shadow:0 0 6px #2f8}
#scaleBox .vd{font-family:var(--P);font-size:8px;line-height:1.5;color:#fff;max-width:130px}
#packPrice{font-family:var(--P);font-size:9px;color:#fff;text-shadow:2px 2px 0 #000;text-align:center;line-height:1.6}
#packBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#loader{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mut);font-family:var(--P);font-size:9px}
#loader.on{display:flex}
.spin{width:24px;height:24px;background:var(--gold);border:3px solid #101020;animation:sp 1s steps(4) infinite}
/* cards */
.cb{position:absolute;inset:0;border-radius:inherit;border:min(2.6vw,11px) solid #1d4fb4;background:radial-gradient(circle at 50% 48%,#fff 0 7.5%,#1a1a1a 8% 10%,transparent 10.5%),radial-gradient(circle at 50% 48%,transparent 0 15%,#1a1a1a 15.5% 17%,transparent 17.5%),linear-gradient(180deg,#e52b2b 0 47%,#1a1a1a 47% 49%,#f4f4f4 49% 100%) 50% 48%/36% 26% no-repeat,radial-gradient(ellipse at 50% 48%,#5aa0ff 0%,#2860c9 30%,#173c8f 60%,#0f2766 100%)}
#reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;perspective:1300px;z-index:4}
#reveal.on{display:flex}
#stack{position:relative;width:min(72vw,320px);aspect-ratio:63/88}
.card{position:absolute;inset:0;border-radius:4.5%/3.2%;transform-style:preserve-3d;will-change:transform;touch-action:none}
.card .face,.card .back{position:absolute;inset:0;border-radius:inherit;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:6px 6px 0 rgba(0,0,0,.5)}
.card .face{background:#ddd}
.card .face img{width:100%;height:100%;object-fit:cover;display:block}
.card .back{transform:rotateY(180deg)}
.card.tease .back{animation:tease .6s steps(2) infinite}
@keyframes tease{0%,100%{box-shadow:0 0 0 4px #f8d030,0 0 0 8px #101020}50%{box-shadow:0 0 0 4px #58c8f8,0 0 0 8px #101020,0 0 30px 10px #58c8f8}}
.card.ultraTease .back{animation:tease2 .4s steps(2) infinite}
@keyframes tease2{0%,100%{box-shadow:0 0 0 5px #f070d0,0 0 40px 14px #f070d0}50%{box-shadow:0 0 0 5px #f8e070,0 0 70px 24px #f8e070}}
.foil{position:absolute;pointer-events:none;mix-blend-mode:color-dodge;opacity:.6;background:repeating-linear-gradient(110deg,#ff3b3b 0%,#ffd93b 6%,#3bff7a 12%,#3bd2ff 18%,#a43bff 24%,#ff3b3b 30%);background-size:400% 400%;background-position:var(--mx) var(--my);-webkit-mask:radial-gradient(farthest-corner circle at var(--mx) var(--my),#000 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.2) 90%);mask:radial-gradient(farthest-corner circle at var(--mx) var(--my),#000 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.2) 90%)}
.foil.win{inset:10.5% 8.5% 52% 8.5%}.foil.full{inset:0}.foil.rev{inset:0;opacity:.45}
.sparkle{position:absolute;pointer-events:none;mix-blend-mode:color-dodge;opacity:.75;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 .8px,transparent 1.3px);background-size:19px 23px,13px 11px;background-position:calc(var(--mx) * .3) calc(var(--my) * .2),calc(var(--mx) * -.25) 7px;animation:twinkle 1.6s steps(4) infinite}
@keyframes twinkle{50%{opacity:.25}}
.card.ultra .foil{opacity:.85;background:repeating-linear-gradient(125deg,#ff4fd8 0%,#ffe36a 5%,#6affd5 10%,#6a8bff 15%,#ff4fd8 20%);background-size:400% 400%}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(255,255,255,.8) 0%,rgba(255,255,255,.12) 30%,rgba(0,0,0,.3) 90%)}
.badge{position:absolute;top:-12px;right:-10px;z-index:3;background:var(--red);color:#fff;font-family:var(--P);font-size:8px;padding:5px 6px;border:2px solid #101020;transform:translateZ(30px)}
.badge.mp{background:#f088c8;color:#000;left:-10px;right:auto}
.rtag{position:absolute;bottom:-40px;left:-10%;right:-10%;text-align:center;font-family:var(--P);font-size:8px;line-height:1.6;color:#fff;text-shadow:2px 2px 0 #000;opacity:0}
.rtag b{color:#68e888;font-weight:400}
.card.live .rtag{opacity:1}
.mp-off .face{background:#f2eee2}.mp-off .face img{transform:translate(7%,4.5%)}

.buyerArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.av{font-size:62px;line-height:1;animation:walkin .5s steps(5)}
@keyframes walkin{from{transform:translateX(60vw);opacity:0}}
.av.leave{animation:walkout .4s steps(4) forwards}
@keyframes walkout{to{transform:translateX(-70vw);opacity:0}}
.bn{font-family:var(--P);font-size:11px;margin-top:6px}.bt{color:var(--mut);font-family:var(--P);font-size:7px;margin-top:4px}
.pati{display:flex;gap:4px;justify-content:center;margin-top:6px}.pati i{width:14px;height:6px;background:#68e888}.pati i.x{background:rgba(255,255,255,.15)}
.bubble,.tbox{background:#f8f8f8;color:#101020;border:4px double #101020;box-shadow:0 0 0 3px #f8f8f8;padding:10px 12px;font-size:20px;margin-top:12px;max-width:340px;text-align:left;line-height:1.1;position:relative}
.deal{display:flex;gap:14px;align-items:center;margin-top:12px}
.deal .dimg{width:76px;flex:none}
.deal .dimg img{width:100%;display:block}
.deal .dtx{font-size:18px;color:var(--mut);line-height:1.1}
.deal .dtx b{color:#fff;display:block;font-weight:400}
.offer{font-family:var(--P);font-size:18px;color:#68e888;margin-top:6px}
.ctrl{flex:none;padding-top:6px}
.ctrl .two .btn{margin-top:10px}
.ask{display:flex;align-items:center;gap:8px;margin-top:4px}
.ask input[type=range]{flex:1;accent-color:#f8d030;height:30px}
.ask .nb{width:38px;height:34px;border:3px solid #101020;background:#202850;color:#fff;font-family:var(--P);font-size:12px;box-shadow:0 0 0 2px #f0f0f0}
.askLbl{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;color:var(--mut)}
.askLbl b{font-family:var(--P);font-size:14px;font-weight:400}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick .p{position:relative;overflow:hidden;border:3px solid #303868}
.pick .p img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block}
.pick .p.on{border-color:var(--gold)}
.pick .p .pv{position:absolute;bottom:0;left:0;right:0;font-size:13px;text-align:center;background:rgba(0,0,0,.8);color:#68e888;line-height:1.05}
.pick .p .ck{position:absolute;top:3px;right:3px;width:18px;height:18px;background:var(--gold);color:#000;font-family:var(--P);font-size:9px;display:none;align-items:center;justify-content:center}
.pick .p.on .ck{display:flex}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dl{position:relative;overflow:hidden;background:var(--panel);padding-bottom:5px;text-align:center}
.dl img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block}
.dl .pr{font-family:var(--P);font-size:8px;color:#fff;background:var(--red);margin:5px 5px 0;padding:4px 0}
.dl .hv{font-size:14px;color:var(--mut);margin-top:3px;line-height:1}
.dl.boughtx{opacity:.25;pointer-events:none}
.dl .box2{aspect-ratio:63/88;display:flex;align-items:center;justify-content:center;font-size:40px;background:#4a2a10}
/* hof */
.wall{margin-top:10px}
.wallIn{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px;padding:22px 12px 30px;background:repeating-linear-gradient(90deg,#4a2c14 0 30px,#3c2410 30px 32px);border:3px solid #f0f0f0;box-shadow:0 0 0 3px #101020}
.frame{position:relative;padding:6px;background:#d8a838;border:3px solid #101020;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.frame img{width:100%;display:block;aspect-ratio:63/88;object-fit:cover}
.frame .pl{position:absolute;left:4%;right:4%;bottom:-18px;background:#f0d080;color:#2a1a05;font-size:13px;text-align:center;padding:0 2px;white-space:nowrap;overflow:hidden;border:2px solid #101020;line-height:1.1}
.jobCard{width:min(50vw,210px);aspect-ratio:63/88;margin:14px auto 0;overflow:hidden;border:3px solid #101020;transition:transform .2s steps(3)}
.jobCard img{width:100%;height:100%;object-fit:cover}
/* multi rip */
#multi{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;background:#0a0c20;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 16px);touch-action:none}
#multi.on{display:flex}
#multi .mh{font-family:var(--P);font-size:12px;color:var(--gold);text-shadow:3px 3px 0 #000;text-align:center;line-height:1.6}
#multi .mh small{display:block;color:var(--mut);font-family:var(--B);font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:420px;margin:18px 0}
.mp{position:relative;aspect-ratio:100/178;transform:translateY(-120vh);transition:transform .45s steps(6)}
.mp.in{transform:none}
.mp.shake{animation:mshake .14s steps(2) infinite}
@keyframes mshake{50%{transform:translate(2px,-2px) rotate(2deg)}}
.mp.boom .art{animation:boom .3s steps(3) forwards}
@keyframes boom{to{transform:scale(1.4);opacity:0;filter:brightness(4)}}
.mp .res{position:absolute;inset:6% 0;display:none;border:2px solid #101020}
.mp .res img{width:100%;height:100%;object-fit:cover}
.mp.done .res{display:block;animation:pop .3s steps(3)}
.mp.done.hit .res{box-shadow:0 0 0 3px #f8d030,0 0 16px #f8d030}
.mp.done.ult .res{box-shadow:0 0 0 3px #f070d0,0 0 22px #f070d0}
.mp .pv2{position:absolute;bottom:-20px;left:-10%;right:-10%;text-align:center;font-size:15px;color:#68e888;display:none}
.mp.done .pv2{display:block}
#mStage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;perspective:1200px}
#mHit{position:relative;width:min(64vw,280px);aspect-ratio:63/88}
.mrows{width:100%;overflow-y:auto;touch-action:pan-y;flex:1;margin-top:10px}
.mrow{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:8px}
.mrow img{width:100%;aspect-ratio:63/88;object-fit:cover;border:1px solid #101020}
.mrow img.h{outline:2px solid #58c8f8}.mrow img.u{outline:2px solid #f8d030}
.mrowl{font-family:var(--P);font-size:6px;color:var(--mut);margin-bottom:4px;display:flex;justify-content:space-between}
/* machine */
.mach{position:relative;width:250px;height:290px;margin:12px auto 0}
.mach .hop{position:absolute;left:70px;top:0;width:110px;height:56px;background:#606878;clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);border-top:6px solid #a0a8b8}
.mach .bodyM{position:absolute;left:20px;right:20px;top:56px;height:170px;background:#d04040;border:4px solid #101020;box-shadow:inset -8px -8px 0 rgba(0,0,0,.25),inset 8px 8px 0 rgba(255,255,255,.2)}
.mach .scr{position:absolute;left:18px;right:18px;top:16px;height:64px;background:#0a1a0e;border:4px solid #101020;font-family:var(--P);font-size:8px;color:#68ff88;padding:6px;line-height:1.7;overflow:hidden}
.mach .lights{position:absolute;left:18px;bottom:16px;display:flex;gap:8px}
.mach .lights i{width:14px;height:14px;background:#401010;border:3px solid #101020}
.mach.run .lights i{animation:lt .6s steps(1) infinite}
.mach.run .lights i:nth-child(2){animation-delay:.2s}.mach.run .lights i:nth-child(3){animation-delay:.4s}
@keyframes lt{0%{background:#f8d030}50%{background:#401010}}
.mach .gear{position:absolute;right:18px;bottom:12px;width:44px;height:44px;background:repeating-conic-gradient(#a0a8b8 0 20deg,transparent 20deg 45deg);border-radius:50%}
.mach .gear::after{content:"";position:absolute;inset:12px;background:#606878;border:3px solid #101020;border-radius:50%}
.mach.run .gear{animation:sp 1s steps(8) infinite}
.mach .chute{position:absolute;left:0;right:0;top:226px;height:40px;background:#303848;border:4px solid #101020;overflow:hidden}
.mach .chute .belt{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#404858 0 10px,#2a3040 10px 20px)}
.mach.run .chute .belt{animation:belt .5s steps(4) infinite}
@keyframes belt{to{background-position:-20px 0}}
.mach .out{position:absolute;top:4px;height:28px;aspect-ratio:63/88;border:2px solid #101020;animation:conv 2.8s steps(28) forwards}
.mach .out img{width:100%;height:100%;object-fit:cover}
.mach .out.h{box-shadow:0 0 0 2px #f8d030}
@keyframes conv{from{left:100%}to{left:-30px}}
.mach .drop{position:absolute;left:108px;top:-60px;width:34px;aspect-ratio:100/178;animation:drop .7s steps(7) forwards;z-index:2}
@keyframes drop{to{top:40px;opacity:0}}
.mlog{font-size:17px;color:var(--mut);line-height:1.05;margin-top:6px;max-height:110px;overflow:hidden}
.mlog b{color:var(--gold);font-weight:400}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.stepper .chip{font-size:8px;padding:9px 10px}
/* minigames */
#mg{position:fixed;inset:0;z-index:52;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px);background:#0a0c20;touch-action:none}
#mg.on{display:flex}
.wtp{position:relative;width:min(80vw,320px);aspect-ratio:1;margin-top:14px;background:repeating-conic-gradient(from 0deg,#2868d8 0 10deg,#4888f0 10deg 20deg);border:4px solid #101020;box-shadow:0 0 0 4px #f8d030;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wtp img{width:84%;height:84%;object-fit:contain;filter:brightness(0);transition:filter .5s steps(5);image-rendering:pixelated}
.wtp.rev img{filter:none}
.wtt{font-family:var(--P);font-size:14px;color:var(--gold);text-shadow:3px 3px 0 #2050a0,6px 6px 0 #000;text-align:center;line-height:1.5}
.ansg{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px;margin-top:16px}
.ansg .btn{margin:0;font-size:8px;padding:12px 4px}
.ansg .btn.ok{background:var(--grn);color:#fff}.ansg .btn.no{background:var(--red);color:#fff}
.hlrow{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:18px}
.hlc{width:min(38vw,150px);text-align:center}
.hlc img{width:100%;aspect-ratio:63/88;object-fit:cover;border:3px solid #101020;box-shadow:0 0 0 3px #f0f0f0}
.hlc .v{font-family:var(--P);font-size:11px;margin-top:10px;color:#68e888}
.hlc .v.q{color:var(--gold)}
/* intro */
#intro{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:#f8f8f8;color:#101020;touch-action:none}
#intro.on{display:flex}
#intro.dark{background:#000;color:#fff}
#iStage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#iBox{margin:0 10px calc(env(safe-area-inset-bottom) + 16px);background:#f8f8f8;color:#101020;border:5px double #101020;box-shadow:0 0 0 4px #f8f8f8,0 0 0 7px #101020;padding:14px 16px 22px;font-family:var(--P);font-size:11px;line-height:2;min-height:112px;position:relative}
#iBox .arr{position:absolute;right:12px;bottom:6px;animation:blink .6s steps(1) infinite}
.title{text-align:center}
.title .t1{font-family:var(--P);font-size:clamp(30px,11vw,48px);color:#f8d030;text-shadow:4px 4px 0 #2050a0,-3px -3px 0 #2050a0,3px -3px 0 #2050a0,-3px 3px 0 #2050a0,8px 8px 0 #000;line-height:1.2}
.title .t2{font-family:var(--P);font-size:10px;color:#fff;margin-top:16px;letter-spacing:.1em}
.title .ps{font-family:var(--P);font-size:11px;color:#fff;margin-top:60px;animation:blink 1s steps(1) infinite}
.title .cr{font-family:var(--P);font-size:7px;color:#808080;margin-top:40px}
.isp{transition:transform .8s steps(8),opacity .6s steps(6)}
.gpick{display:flex;gap:26px;margin-top:20px}
.gpick button{background:#f8f8f8;border:4px solid #101020;padding:10px;font-family:var(--P);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#101020}
.gpick button.on{background:#f8d030}
.nameIn{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:0 20px}
.nameIn input{width:100%;max-width:300px;border:4px solid #101020;background:#fff;padding:12px;font-family:var(--P);font-size:16px;text-transform:uppercase;text-align:center;color:#101020;-webkit-user-select:text;user-select:text}
.nameIn .pre{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.nameIn .pre button{border:3px solid #101020;background:#f8f8f8;font-family:var(--P);font-size:9px;padding:8px 10px;color:#101020}
.nameIn .go{background:#101020;color:#f8d030}

</style>

const CACHE='packrip_cards7_';const memo={};
function rarityTier(r){r=(r||'').toLowerCase();
 if(r&&/(ex|star|secret|shining|ultra|crystal|legend)/.test(r))return 'ultra';
 if(r.includes('holo'))return 'holo';if(r.includes('rare'))return 'rare';if(r.includes('uncommon'))return 'uncommon';return 'common'}
async function fetchJSON(url,ms=15000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}

async function loadSet(id){
 const m=loadCached(id);if(m)return m;
 let cards=null;
 try{const j=await fetchJSON(`https://api.pokemontcg.io/v2/cards?q=set.id:${id}&pageSize=250&select=id,name,number,rarity,images,supertype,nationalPokedexNumbers,types`,20000);
  cards=j.data.map(c=>({id:c.id,n:c.number,name:c.name,r:rarityTier(c.rarity),s:c.images.small,l:c.images.large,t:c.supertype,dex:(c.nationalPokedexNumbers||[])[0]||0,ty:(c.types||[])[0]||''}));
 }catch(e){
  const j=await fetchJSON(`https://api.tcgdex.net/v2/en/sets/${id}`);const list=(j.cards||[]).filter(c=>c.image);const N=list.length;
  cards=list.map((c,i)=>{const p=i/N;return {id:c.id,n:c.localId,name:c.name,r:p<.14?'holo':p<.25?'rare':p<.5?'uncommon':'common',s:c.image+'/low.webp',l:c.image+'/high.webp',t:'Pokémon',dex:0,ty:''}});
 }
 if(!cards||!cards.length)throw new Error('empty');
 cards.sort((a,b)=>(parseInt(a.n)||999)-(parseInt(b.n)||999)||String(a.n).localeCompare(String(b.n)));
 try{localStorage.setItem(CACHE+id,JSON.stringify(cards))}catch(e){}
 return memo[id]=finalize(id,cards);
}
function finalize(id,cards){
 const set=setById[id];const P={common:[],uncommon:[],rare:[],holo:[],ultra:[]};
 cards.forEach(c=>P[c.r].push(c));
 if(!P.ultra.length&&set.ch){const picked=[];cards.forEach(c=>{if(picked.length<3&&c.r!=='common'&&c.r!=='uncommon'&&set.ch.some(n=>c.name===n||c.name.includes(n))&&!picked.find(p=>p.name===c.name))picked.push(c)});
  picked.forEach(c=>{P[c.r]=P[c.r].filter(x=>x!==c);c.r='ultra';P.ultra.push(c)})}
 if(!P.ultra.length&&P.holo.length){const c=P.holo.pop();c.r='ultra';P.ultra.push(c)}
 if(!P.holo.length&&P.rare.length){P.holo=P.rare.splice(0,Math.ceil(P.rare.length/3));P.holo.forEach(c=>c.r='holo')}
 S.tot[id]=cards.length;
 return {id,cards,P,byId:Object.fromEntries(cards.map(c=>[c.id,c]))};
}

function hsh(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const popCache={};
function pop(name){if(popCache[name])return popCache[name];const n=name.toLowerCase();let m=0;for(const k in POP)if(n.includes(k))m=Math.max(m,POP[k]);return popCache[name]=m||(.7+(hsh(n)%100)/125)}

 pool.sort((a,b)=>hsh(a.id+'h'+dayN())-hsh(b.id+'h'+dayN()));pool.slice(0,4).forEach(c=>hotSet.add(c.id));return hotSet}
function mkt(id){let f=1+((hsh(id+':'+dayN())%1000)/1000-.5)*.2;if(hotIds().has(id))f*=1.8;if(crashToday())f*=.7;return f}

 S.coll[s][id]=n-1;if(isFake)S.fakes[id]=f-1;else if(f>S.coll[s][id])S.fakes[id]=S.coll[s][id];return isFake}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
const NB={};
function nbuf(dur){const a=ac();if(!a)return null;const k=Math.round(dur*100);if(NB[k])return NB[k];const len=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,len,a.sampleRate);const d=b.getChannelData(0);let v=0;for(let i=0;i<len;i++){if(i%6===0)v=Math.random()*2-1;d[i]=v*Math.pow(1-i/len,2)}return NB[k]=b}
function noise(dur,vol,freq,q=1,type='highpass'){const a=ac();if(!a)return;const b=nbuf(dur);const s=a.createBufferSource();s.buffer=b;s.playbackRate.value=.85+Math.random()*.3;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function tone(fr,dur,vol,type='square',gap=.07){const a=ac();if(!a)return;fr.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+i*gap;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.linearRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)})}

const PXS=3,cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;
function rs(){cv.width=Math.ceil(innerWidth/PXS);cv.height=Math.ceil(innerHeight/PXS)}rs();addEventListener('resize',rs);
function fxLoop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy=p.vy*.95+.06;p.life-=p.dec;if(p.life<.3&&Math.random()<.3)continue;cx.fillStyle=p.c;const s=Math.max(1,Math.round(p.size));
 if(p.star){const x=Math.round(p.x),y=Math.round(p.y);cx.fillRect(x-s,y,s*3,s);cx.fillRect(x,y-s,s,s*3)}else cx.fillRect(Math.round(p.x),Math.round(p.y),s,s)}
 if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;cx.clearRect(0,0,cv.width,cv.height)}}
function kick(){if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}

function pickUnique(arr,k,used){const a=arr.filter(c=>!used.has(c.id));const out=[];while(out.length<k&&a.length)out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);out.forEach(c=>used.add(c.id));return out}

const MISV=[['off','Off-center'],['ink','Ink blot'],['crimp','Crimp error']];
function buildPack(D,set){
 const n=S.packs+1,pos=((n-1)%200)+1;if(pos===1&&n>1&&!S.flags['god'+n]){S.godAt=1+Math.floor(Math.random()*200);S.flags['god'+n]=1}
 const used=new Set(),P=D.P;let out;
 if(pos===S.godAt){const cards=shuffle(fill([],10,[P.holo,P.ultra,P.rare],used));const ui=cards.findIndex(c=>c.r==='ultra');if(ui>=0)cards.push(cards.splice(ui,1)[0]);out={cards:cards.map(c=>({c})),god:true}}
 else{const ne=a=>a.filter(c=>!/energy/i.test(c.name)||Math.random()<.15);
  const com=fill([],set.e?5:6,[ne(P.common),P.common,P.uncommon],used),unc=fill([],3,[P.uncommon,P.common],used);
  const cs=shuffle([...com,...unc]).map(c=>({c}));
  if(set.e){const rv=fill([],1,[[...P.common,...P.uncommon,...P.rare]],used)[0];if(rv)cs.push({c:rv,rev:true})}
  const r=Math.random();const hit=r<.01?fill([],1,[P.ultra,P.holo,P.rare],used)[0]:r<.135?fill([],1,[P.holo,P.rare],used)[0]:fill([],1,[P.rare,P.holo,P.uncommon],used)[0];
  cs.push({c:hit});out={cards:cs,god:false}}
 out.cards.forEach(x=>{if(Math.random()<.006)x.mis=rnd(MISV)[0]});
 out.heavy=out.god||out.cards.some(x=>x.c.r==='holo'||x.c.r==='ultra');
 out.weight=out.heavy?rr(21.4,22.5):rr(20.5,21.7);
 return out}

 pk.cards.forEach(x=>{const c=x.c;if(!(S.seen[set.id]||{})[c.id]&&!newIds.includes(c.id))newIds.push(c.id);
  if(x.mis){S.mis.push({uid:uid(),id:c.id,name:c.name,r:c.r,s:c.s,l:c.l,t:c.t,v:x.mis});S.seen[set.id]=S.seen[set.id]||{};S.seen[set.id][c.id]=1;S.nm[c.id]=c.name;S.stats.mis++;pv+=cardVal(c,{mis:1})}
  else{addRaw(c);pv+=cardVal(c)}

 if(pk.god)S.gods++;

 addXP((10+holo*20+(best.r==='ultra'?40:0))*(machine?.4:1),machine);prog('rip',1);if(holo)prog('holo',1);

function dmgSVG(g,seed){const L=LVL[g],R=mulberry(seed),W=63,H=88;let s='';const q=(a,b)=>a+R()*(b-a);
 const ew=[0,3,5,7,9,12,15,18,22,26,30][L];
 for(let i=0;i<ew;i++){const e=Math.floor(R()*4),len=q(.8,2+L*.6),w=q(.25,.45+L*.08),o=q(.55,.95);
  if(e<2){const x=q(1,W-1),y=e?H-.2:.2;s+=`<line x1="${x}" y1="${y}" x2="${x+len}" y2="${y}" stroke="#fff" stroke-width="${w}" opacity="${o}"/>`}
  else{const y=q(1,H-1),x=e===2?.2:W-.2;s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+len}" stroke="#fff" stroke-width="${w}" opacity="${o}"/>`}}
 [[0,0],[W,0],[0,H],[W,H]].slice(0,Math.min(4,L)).forEach(([x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="${q(.8,1.2+L*.35)}" fill="#fff" opacity="${q(.6,.95)}"/>`});

 for(let i=0;i<[0,0,0,0,0,0,1,1,2,4,5][L];i++){let x1,y1,x2,y2;if(R()<.5){x1=0;x2=W;y1=q(10,H-10);y2=y1+q(-14,14)}else{y1=0;y2=H;x1=q(8,W-8);x2=x1+q(-12,12)}const mx=(x1+x2)/2+q(-3,3),my=(y1+y2)/2+q(-3,3);

 for(let i=0;i<(L>=7?L-6:0);i++)s+=`<ellipse cx="${q(8,W-8)}" cy="${q(8,H-8)}" rx="${q(4,10)}" ry="${q(3,8)}" fill="url(#stn${seed})" opacity="${q(.35,.6)}"/>`;
 if(L>=10){const y=q(30,60);s+=`<path d="M${W},${y} l-6,1.5 l-3,-1 l-5,2.2 l-4,-.8" stroke="#2a1a0a" stroke-width=".55" fill="none" opacity=".75"/>`}

function machScr(){const r=S.machine.run;return `PACK ${r.done}${r.left>0?'/'+(r.done+r.left):''}<br>VALUE ${fmt(r.val)}<br>${r.lastHit?'HIT: '+esc(r.lastHit).toUpperCase().slice(0,16):'…'}`}
function machReport(r){const set=setById[r.set],profit=r.val-r.spent;return `<div class="pnl"><div class="row2"><div class="tx"><b>${set.n} · ${r.done} packs</b><small>${r.why||''}</small></div></div><p>Spent <span class="money out">${fmt(r.spent)}</span> · pulled <span class="money in">${fmt(r.val)}</span><br>Result <span class="money ${profit>=0?'in':'out'}">${profit>=0?'+':'−'}${fmt(Math.abs(profit))}</span> · ${r.hits.length} hits shown</p><div class="grid5" style="margin-top:10px">${r.hits.slice(0,15).map(x=>`<div class="mini ${x.r} ${x.mis?'mp-'+x.mis:''}"><img src="${x.s}"><span class="pv">${fmt(x.v)}</span></div>`).join('')||'<p class="empty" style="grid-column:1/-1">No holos.</p>'}</div></div>`}
$('#machBody').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;

 if(t.id==='mGo'){S.machine.run={set:mSel.set,left:mSel.count,reserve:mSel.reserve,done:0,spent:0,val:0,hits:[],log:[],start:NOW()};save();fanfare();renderMachine();updPill();return}

let machBusy=false;
async function machineTick(){const m=S.machine;if(!m.run||machBusy)return;machBusy=true;
 try{const run=m.run,set=setById[run.set];let D=memo[set.id];if(!D)D=await loadSet(set.id);
  const price=packPrice(set);if(S.coins-price<run.reserve){finishMachine(S.coins<price?'Out of money':'Reserve reached');return}
  S.coins=Math.round((S.coins-price)*100)/100;S.stats.spent+=price;updCoin();
  const pk=buildPack(D,set);const r=commitPack(pk,set,true);S.stats.machine++;
  run.done++;run.spent+=price;run.val+=r.pv;
  pk.cards.forEach(x=>{if(x.c.r==='holo'||x.c.r==='ultra'||x.mis){const v=cardVal(x.c,{mis:x.mis?1:0});run.hits.push({id:x.c.id,s:x.c.s,r:x.c.r,mis:x.mis,v,name:x.c.name});run.lastHit=x.c.name;run.log.unshift(`#${run.done} <b>${esc(x.c.name)}</b> ${x.mis?'MISPRINT':x.c.r.toUpperCase()} ${fmt(v)}`)}});
  run.hits.sort((a,b)=>b.v-a.v);run.hits=run.hits.slice(0,30);run.log=run.log.slice(0,6);
  if(run.left>0){run.left--;if(run.left===0){finishMachine('All packs opened');return}}
  save();machAnim(pk,r)}catch(e){}finally{machBusy=false}}
function machAnim(pk,r){if(!$('#scrMachine').classList.contains('on'))return;const v=$('#machV');if(!v)return;
 const sc=$('#mScr');if(sc)sc.innerHTML=machScr();
 const d=document.createElement('div');d.className='drop';d.innerHTML=artStr||'';if(!artStr){d.style.background='var(--c1)';d.style.border='2px solid #101020'}v.appendChild(d);setTimeout(()=>d.remove(),800);
 setTimeout(()=>{const ch=v.querySelector('.chute');const o=document.createElement('div');o.className='out'+(r.holo?' h':'');o.innerHTML=`<img src="${r.best.s}">`;ch.appendChild(o);setTimeout(()=>o.remove(),2900);noise(.05,.3,1200,1,'bandpass');if(r.holo){sfx.holo();const b=v.getBoundingClientRect();burst(30,['#f8d030','#fff'],.6,b.left+b.width/2,b.top+b.height-30)}},650);
 const run=S.machine.run;if(run){const p=document.querySelector('#machBody .pnl p');if(p)p.innerHTML=`Packs <b>${run.done}</b>${run.left>0?' / '+(run.done+run.left):' · until broke'} · spent <span class="money out">${fmt(run.spent)}</span> · pulled <span class="money in">${fmt(run.val)}</span>`;const lg=$('#mLog');if(lg)lg.innerHTML=run.log.join('<br>')}}
function finishMachine(why){const m=S.machine;if(!m.run)return;m.run.why=why;m.last=m.run;m.run=null;save();updPill();checkUnlocks();checkAll();
 fanfare();modal(`<div class="em">⚙️</div><h2>MACHINE DONE!</h2><p>${why}.</p>${machReport(m.last)}<button class="btn" onclick="closeModal()">OK!</button>`);if($('#scrMachine').classList.contains('on'))renderMachine()}
function updPill(){$('#machPill').classList.toggle('on',!!S.machine.run)}
$('#machPill').onclick=()=>go('scrMachine');
setInterval(machineTick,1300);

async function higherLower(){if(!hlReady())return;await ensureLoaded();const pool=[];unlockedSets().forEach(s=>{const m=memo[s.id];if(m)pool.push(...m.P.rare,...m.P.holo,...m.P.uncommon,...m.P.ultra)});

 const mult=1+rankIdx()*.3,TAB=[0,1,2.5,5,9,15,25].map(v=>Math.round(v*mult*100)/100);let streak=0,cur=rnd(pool);

 const end=(win)=>{S.lastHL=NOW();S.stats.hl++;save();const amt=win?TAB[streak]:0;mg.innerHTML=`<div class="wtt">${win?'CASHED OUT!':'WRONG!'}</div><p class="empty">Streak ${streak}</p>${amt?`<button class="btn earn" id="hC" style="max-width:340px">COLLECT ${IN(amt)}</button>`:`<button class="btn ghost" id="hC" style="max-width:340px">OK</button>`}`;$('#hC').onclick=()=>{if(amt)addCoins(amt);closeMg()}};

  mg.innerHTML=`<div class="wtt">HIGHER OR<br>LOWER?</div><p class="empty" style="padding:6px">Streak ${streak} · next win <span class="money in">${IN(TAB[Math.min(6,streak+1)])}</span></p>
  <div class="hlrow"><div class="hlc"><img src="${cur.s}"><div class="v">${fmt(cardVal(cur))}</div></div><div class="P" style="font-size:14px">VS</div><div class="hlc"><img src="${nx.s}"><div class="v q" id="hv">???</div></div></div>
  <div class="ansg"><button class="btn" data-h="1">▲ WORTH MORE</button><button class="btn" data-h="0">▼ WORTH LESS</button></div>
  ${streak?`<button class="btn earn" id="hOut" style="max-width:380px">CASH OUT ${IN(TAB[streak])}</button>`:''}<p class="empty" style="font-size:16px">One wrong guess and you lose the streak. Max 6.</p>`;
  if($('#hOut'))$('#hOut').onclick=()=>end(true);
  mg.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{if(mg._lock)return;mg._lock=true;const up=b.dataset.h==='1',right=(cardVal(nx)>cardVal(cur))===up;$('#hv').textContent=fmt(cardVal(nx));$('#hv').classList.remove('q');

 const c=e.target.closest('[data-claim]');if(c){const d=DPOOL.find(x=>x.k===c.dataset.claim);if(S.daily.claimed.includes(d.k))return;S.daily.claimed.push(d.k);addCoins(dReward(d));addXP(40);sfx.cash();save();renderHome();return}
 if(e.target.closest('#oak')){const s=rnd(unlockedSets());S.sealed.push({uid:uid(),set:s.id,kind:'bundle',packs:6,base:6*packPrice(s),bought:NOW()});S.lastOak=NOW();save();fanfare();modal(`<div class="em">${sprite('oak',5)}</div><h2>PROF. OAK</h2><p>"A true researcher needs samples!"<br>You got a sealed <b>${s.n} bundle</b>. It's in your Vault.</p><button class="btn" onclick="closeModal()">THANKS!</button>`);renderHome();return}
 if(e.target.closest('#grailPick')){pickGrail();return}});
async function pickGrail(){await ensureLoaded();const pool=[];unlockedSets().forEach(s=>{const m=memo[s.id];if(m)pool.push(...m.P.ultra)});pool.sort((a,b)=>cardVal(b)-cardVal(a));
 modal(`<h2>CHOOSE YOUR GRAIL</h2><p>Ultra rares from unlocked sets.</p><div class="grid5" style="grid-template-columns:repeat(3,1fr);margin-top:12px">${pool.slice(0,15).map(c=>`<div class="mini ultra" data-g="${c.id}" style="cursor:pointer"><img src="${c.s}"><span class="pv">${fmt(cardVal(c,{grade:10}))}</span></div>`).join('')}</div><button class="btn ghost" onclick="closeModal()">CANCEL</button>`);
 document.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{const c=cardById(el.dataset.g);S.grail={id:c.id,name:c.name,img:c.s};save();closeModal();renderHome();toast('Grail set: '+c.name)})}

/* =================== QUESTS / GYMS / MARKET / HOF / STATS =================== */
function renderQuests(){ensureBounties();let h='';const st=STORY[S.story];
 h+=`<div class="pnl gold"><div class="row2"><div class="ic">${sprite('gpa',2)}</div><div class="tx"><b>GRANDPA'S STORY · ${Math.min(S.story+1,STORY.length)}/${STORY.length}</b></div></div>${st?`<div class="big">${st.t.toUpperCase()}</div><p>${st.d}</p><div class="row2"><div class="tx"><small>Reward: ${st.rt}</small></div><button class="sbtn ${st.ok()?'earn':'g'}" id="stClaim" ${st.ok()?'':'disabled'}>${st.ok()?'CLAIM':'IN PROGRESS'}</button></div>`:'<div class="big">THE END… FOR NOW</div><p>Grandpa framed the first page.</p>'}</div>`;
 h+=`<h3 class="sec">Bounties</h3><div class="pnl">${S.bounties.map((b,i)=>`<div class="row2"><img class="th" src="${b.img}"><div class="tx"><b>${esc(b.name)}</b><small>${setById[setOf(b.id)].n} · ${Math.ceil((b.until-NOW())/HOUR)}h left · you have ${rawCount(b.id)}</small></div><button class="sbtn earn" data-b="${i}" ${rawCount(b.id)?'':'disabled'}>${IN(b.reward)}</button></div>`).join('')||'<p>No bounties right now.</p>'}</div>`;
 h+=`<h3 class="sec">Collections</h3><div class="pnl">${COLS.map(([n,l,r])=>{const [a,b]=colProgress(l),done=S.cols.includes(n);return `<div class="row2"><div class="tx"><b>${n}</b><small>${l[0]==='pikachu×5'?'5 different Pikachu cards':l.map(x=>x[0].toUpperCase()+x.slice(1)).join(' · ')}</small><div class="mbar"><i style="width:${a/b*100}%"></i></div></div><button class="sbtn ${done?'g':'earn'}" data-col="${n}" ${a>=b&&!done?'':'disabled'}>${done?'✓':`${IN(r)}+PACK`}</button></div>`}).join('')}</div>`;
 h+=`<h3 class="sec">Achievements · ${S.ach.length}/${ACH.length}</h3><div class="pnl">${ACH.map(([k,n,d,ok,r])=>`<div class="row2" style="${S.ach.includes(k)?'':'opacity:.45'}"><div class="ic">${S.ach.includes(k)?'🏆':'🔒'}</div><div class="tx"><b>${n}</b><small>${d} · ${IN(r)}</small></div></div>`).join('')}</div>`;
 $('#questBody').innerHTML=h}
$('#questBody').addEventListener('click',e=>{
 if(e.target.closest('#stClaim')){const st=STORY[S.story];if(!st||!st.ok())return;const r=st.r;
  if(r.c)addCoins(r.c);if(r.free){S.free+=r.free;toast(`+${r.free} free packs`)}if(r.seal){const s=setById[r.seal];S.sealed.push({uid:uid(),set:s.id,kind:r.kind,packs:18,base:18*packPrice(s),bought:NOW()});toast('Sealed Base Set box added to your Vault')}
  S.story++;addXP(60);save();fanfare();renderQuests();checkAll();return}
 const b=e.target.closest('[data-b]');if(b){handBounty(+b.dataset.b);return}
 const c=e.target.closest('[data-col]');if(c&&!c.disabled){const col=COLS.find(x=>x[0]===c.dataset.col);if(S.cols.includes(col[0]))return;S.cols.push(col[0]);addCoins(col[2]);S.free++;addXP(50);save();fanfare();toast(`${col[0]} complete! +1 free pack`);renderQuests();checkAll()}});
async function renderGyms(){$('#gymBody').innerHTML='<div style="display:flex;justify-content:center;padding:40px"><div class="spin"></div></div>';await ensureLoaded();
 $('#gymBody').innerHTML=`<p class="empty" style="text-align:left;padding:10px 2px">Show each Gym Leader 3 of your cards of their type. The team value must reach their bar. You keep your cards. Every badge is a permanent bonus.</p>`+
 GYMS.map(([k,n,city,type,need,b,bn,bd,em])=>{const team=gymTeam(type),tot=team.reduce((a,o)=>a+o.v,0),has=hasBadge(b),ok=team.length>=3&&tot>=need;
  return `<div class="pnl ${has?'gold':''}"><div class="row2"><div class="ic">${has?'🏅':em}</div><div class="tx"><b>${n} · ${city}</b><small>${type==='Holo'?'Any holo or ultra rare':type+' type'} · team ${fmt(need)}+<br>${has?'✓ ':''}${bn}: ${bd}</small></div>${has?'':`<button class="sbtn" data-gym="${k}" ${ok?'':'disabled'}>BATTLE</button>`}</div>
  ${has?'':`<div style="display:flex;gap:6px;margin-top:6px">${team.map(o=>`<img class="th" src="${o.c.s}" style="width:42px">`).join('')}<div style="flex:1;font-size:16px;color:var(--mut);align-self:center;text-align:right">${team.length}/3 · ${fmt(tot)}</div></div><div class="mbar"><i style="width:${Math.min(100,tot/need*100)*(team.length/3)}%"></i></div>`}</div>`}).join('')}
$('#gymBody').addEventListener('click',e=>{const b=e.target.closest('[data-gym]');if(!b||b.disabled)return;const g=GYMS.find(x=>x[0]===b.dataset.gym);if(hasBadge(g[5]))return;
 S.badges.push(g[5]);addXP(150);save();flash(1,800);fanfare();burst(220,['#f8d030','#fff','#58c8f8'],1.3);
 modal(`<div class="em">${g[8]}</div><h2>${g[1]} WAS DEFEATED!</h2><p>${esc(pname())} received the <b>${g[6]}</b>!<br>${g[7]}</p><button class="btn" onclick="closeModal()">OK!</button>`);renderGyms();checkAll()});
async function renderMarket(){$('#marketBody').innerHTML='<div style="display:flex;justify-content:center;padding:40px"><div class="spin"></div></div>';await ensureLoaded();
 const hot=[...hotIds()].map(cardById).filter(Boolean);const items=allItems().sort((a,b)=>b.val-a.val).slice(0,15);
 $('#marketBody').innerHTML=`<div class="pnl ${crashToday()?'red':'gold'}"><h4>${crashToday()?'📉 CRASH DAY':'📈 MARKET OPEN'}</h4><p>${crashToday()?'Prices are 30% lower everywhere today.':'Prices drift every day. Hot cards trade at 1.8× for 24 hours.'}</p></div>
 <h3 class="sec">🔥 Hot today</h3><div class="pnl">${hot.map(c=>`<div class="row2"><img class="th" src="${c.s}"><div class="tx"><b>${esc(c.name)}</b><small>${setById[setOf(c.id)].n} · you have ${rawCount(c.id)}</small></div><span class="money in">${fmt(cardVal(c))}</span></div>`).join('')||'<p>Open some sets first.</p>'}</div>
 <h3 class="sec">Your most valuable items</h3><div class="pnl">${items.map((it,i)=>`<div class="row2"><img class="th" src="${it.img}" style="${it.k==='seal'?'object-fit:contain;background:#222':''}"><div class="tx"><b>${esc(it.name)}${it.k==='slab'?' <span class="tag">PSA '+it.grade+'</span>':it.k==='mis'?' <span class="tag p">ERROR</span>':''}${it.cnt>1?' ×'+it.cnt:''}</b><small>Market ${fmt(it.val)}</small></div>${it.k==='seal'?'':`<button class="sbtn earn" data-qs="${i}">SELL ${IN(it.val*.45)}</button>`}</div>`).join('')||'<p>Nothing yet.</p>'}</div>
 <p class="empty">Quick sell pays 45% of market. Card shows and your shop shelf pay much more.</p>`;
 $('#marketBody').querySelectorAll('[data-qs]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.qs];modal(`<h2>QUICK SELL?</h2><p><b>${esc(it.name)}</b><br>Gary pays <span class="money in">${fmt(it.val*.45)}</span> (market ${fmt(it.val)}).</p><button class="btn earn" id="qsY">SELL ${IN(it.val*.45)}</button><button class="btn ghost" onclick="closeModal()">KEEP</button>`);$('#qsY').onclick=()=>{closeModal();quickSell(it);renderMarket()}})}
function renderHof(){const items=allItems().filter(i=>i.k!=='seal').sort((a,b)=>b.val-a.val).slice(0,9);
 $('#hofBody').innerHTML=`<div class="pnl gold"><h4>⭐ ${esc(pname())}'S SHOWCASE</h4>${showcaseHTML()}<p style="text-align:center">Tap a slab in the Vault and pick ★ to change it.</p></div>
 <h3 class="sec">The wall · top 9 pieces</h3>${items.length?`<p class="empty" style="padding:6px">Worth <span class="money in">${fmt(items.reduce((a,i)=>a+i.val,0))}</span> together.</p><div class="wall"><div class="wallIn">${items.map(it=>`<div class="frame">${it.k==='slab'?slabHTML(it.sl,{small:1}):`<img src="${it.img}">`}<div class="pl">${esc(it.name)} ${fmt(it.val)}</div></div>`).join('')}</div></div>`:'<p class="empty">Your wall is empty.</p>'}`;
 $('#hofBody').querySelectorAll('[data-fav]').forEach(el=>el.onclick=()=>{const sl=S.slabs.find(s=>s.uid===el.dataset.fav);if(sl)openSlab(sl)})}
function renderStats(){let own=0;Object.values(S.coll).forEach(s=>Object.values(s).forEach(n=>own+=n));
 const st=[[S.packs,'Packs ripped'],[S.cards,'Cards pulled'],[own,'Cards in hand'],[S.holos,'Holos'],[S.ultras,'Ultra rares'],[S.gods,'God packs'],[S.stats.mis,'Misprints'],[S.sinceHolo,'Since holo'],
  [S.stats.sold,'Items sold'],[fmt(S.stats.earned),'Earned'],[S.stats.graded,'PSA subs'],[S.slabs.filter(s=>s.grade===10&&!s.fake).length,'PSA 10s'],[S.stats.quiz,'Quiz correct'],[S.stats.machine,'Machine packs'],[S.stats.scams,'Scams spotted'],[unlockedSets().length+'/'+SETS.length,'Sets']];
 $('#statsBody').innerHTML=`<div class="sgrid">${st.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
 <h3 class="sec">Best pulls</h3>${S.hist.length?`<div class="pnl">${S.hist.slice(0,12).map(h=>`<div class="row2"><img class="th" src="${h.img}"><div class="tx"><b>${esc(h.name)}</b><small>${setById[h.set].n} · Pack #${h.p} · ${tierName[h.r]}${h.god?' · GOD PACK':''}</small></div></div>`).join('')}</div>`:'<p class="empty">No holos yet.</p>'}
 <h3 class="sec">Rules</h3><div class="odds">10 cards per pack, no duplicates in a pack. Rare slot: <b>12.5% holo</b>, <b>1% ultra rare</b>. One <b>God Pack</b> per 200 packs. Misprints about 1 in 170 cards.<br><br>Next set unlocks at <b>95%</b> of the current set or with a <b>PSA 10 holo</b> from it.<br><br>Ripping loses a little on average, like real life. Make money at shows, with dealers, grading, bounties, quests, minigames and your shop. You can't go broke: daily allowance, free pack, odd jobs and Grandpa are always there.<br><br>PSA: Standard 20 min, Express 3 min, Walk-through instant. Grades are final.</div>
 <button class="btn ghost" id="resetBtn">RESET EVERYTHING</button>`;
 $('#resetBtn').onclick=()=>{if(confirm('Really delete your whole save?')){localStorage.removeItem(KEY);location.reload()}}}

/* =================== INTRO (Gen 1 style) =================== */
function intro(done){const I=$('#intro'),st=$('#iStage'),bx=$('#iBox');I.classList.add('on');let g='boy',name='';
 const typeLine=t=>new Promise(res=>{let i=0;bx.innerHTML='';const sp=document.createElement('span');bx.appendChild(sp);const arr=document.createElement('span');arr.className='arr';arr.textContent='▼';
  const iv=setInterval(()=>{i++;sp.textContent=t.slice(0,i);if(i%2)tone([1200],.02,.015);if(i>=t.length){clearInterval(iv);bx.appendChild(arr);I.onclick=()=>{I.onclick=null;blip();res()}}},28);
  I.onclick=()=>{i=t.length-1}});
 const say=async lines=>{for(const l of lines)await typeLine(l.replace(/\{N\}/g,name))};
 (async()=>{
  I.classList.add('dark');bx.style.display='none';
  st.innerHTML=`<div class="title"><div class="t1">PACK<br>RIP</div><div class="t2">CARD COLLECTOR EDITION</div><div style="margin-top:22px">${sprite('boy',5)}</div><div class="ps">▶ PRESS START</div><div class="cr">© 1999-2026 A FAN GAME</div></div>`;
  await new Promise(r=>I.onclick=()=>{I.onclick=null;ac();fanfare();r()});
  I.classList.remove('dark');bx.style.display='';
  st.innerHTML=`<div class="isp" id="isp">${sprite('oak',8)}</div>`;
  await say(['Hello there! Welcome to the world of POKéMON cards!','My name is OAK! People call me the POKéMON PROF!','This world is full of rare cards waiting to be pulled!','Some people battle with them. Others rip packs, grade and trade them.','Myself… I study holo pulls as a profession.','First, tell me about yourself.']);
  await typeLine('Are you a boy or a girl?');
  st.innerHTML=`<div class="gpick"><button data-g="boy">${sprite('boy',6)}BOY</button><button data-g="girl">${sprite('girl',6)}GIRL</button></div>`;
  g=await new Promise(r=>st.querySelectorAll('[data-g]').forEach(b=>b.onclick=e=>{e.stopPropagation();blip();r(b.dataset.g)}));
  st.innerHTML=`<div class="isp">${sprite(g,8)}</div>`;
  await typeLine('Let\'s begin with your name. What is it?');
  const pre=g==='boy'?['RED','ASH','JACK']:['LEAF','GREEN','JANE'];
  st.innerHTML=`<div class="isp">${sprite(g,6)}</div><div class="nameIn" style="margin-top:16px"><input id="nmI" maxlength="10" placeholder="NEW NAME" autocomplete="off"><div class="pre">${pre.map(p=>`<button data-p="${p}">${p}</button>`).join('')}</div><button class="btn" id="nmGo" style="max-width:300px">OK!</button></div>`;
  I.onclick=null;
  name=await new Promise(r=>{const inp=$('#nmI');inp.onclick=e=>e.stopPropagation();st.querySelectorAll('[data-p]').forEach(b=>b.onclick=e=>{e.stopPropagation();inp.value=b.dataset.p;blip()});
   $('#nmGo').onclick=e=>{e.stopPropagation();const v=inp.value.trim().toUpperCase().slice(0,10);if(!v){inp.value=pre[0];return}blip();r(v)}});
  st.innerHTML=`<div class="isp" id="isp">${sprite(g,8)}</div>`;
  await say(['Right! So your name is {N}!','Your GRANDPA found his old card binder from 1999 in the attic.','He asked you to finish it. You start with $60 and one free pack.','{N}! Your very own POKéMON card legend is about to unfold!','A world of packs, holos and PSA slabs awaits! Let\'s go!']);
  const sp=$('#isp');sp.style.transform='scale(.2)';sp.style.opacity=0;tone([784,659,523,392],.1,.04,'square',.09);await wait(900);
  S.player={name,g};save();I.classList.remove('on');I.onclick=null;done()})()}

/* =================== NAV / BOOT =================== */
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
 const tab=id==='scrOpen'?'scrSets':['scrQuests','scrShop','scrMarket','scrGyms','scrHof','scrStats','scrMachine'].includes(id)?'scrHome':id;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===tab));
 if(id!=='scrOpen'){const r=document.documentElement.style;r.setProperty('--bgh',230);r.setProperty('--bgs','30%')}
 ({scrHome:renderHome,scrSets:renderSets,scrAlbum:renderAlbum,scrVault:renderVault,scrShow:()=>{if(!SH)renderShowList()},scrQuests:renderQuests,scrShop:renderShop,scrMarket:renderMarket,scrGyms:renderGyms,scrHof:renderHof,scrStats:renderStats,scrMachine:renderMachine}[id]||(()=>{}))()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{blip();go(b.dataset.s)});
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>go('scrHome'));
document.addEventListener('gesturestart',e=>e.preventDefault());
setInterval(()=>{checkSubs();if($('#scrVault').classList.contains('on'))renderSubs();if($('#scrHome').classList.contains('on'))renderHomeLive();updDots()},5000);
function dailyBonus(){
 if(S.lastDay!==dayKey()){const first=!S.lastDay;const al=first?0:15+(hasBadge('cascade')?5:0);S.lastDay=dayKey();S.free+=1;if(al)S.coins+=al;save();updCoin();
  setTimeout(()=>modal(first?`<div class="em">${sprite('gpa',5)}</div><h2>GRANDPA</h2><p>"${esc(pname())}! Here's my old binder. Let's fill it together!"<br><br>You have <b>$60</b> and <b>1 free pack</b>.<br>Get 95% of a set to unlock the next one.</p><button class="btn" onclick="closeModal();go('scrSets')">LET'S RIP!</button>`
   :`<div class="em">☀️</div><h2>DAILY BONUS</h2><p><span class="money in">${IN(al)}</span> allowance and <b>1 free pack</b>.<br>New daily missions are up.</p><button class="btn" onclick="closeModal()">NICE!</button>`),400)}}
function boot(){
 SETS.forEach(s=>loadCached(s.id));rollDaily();updCoin();updPill();
 const start=()=>{dailyBonus();renderHome();checkSubs();checkAll();
  unlockedSets().forEach(s=>{if(!memo[s.id])loadSet(s.id).then(()=>{save();if($('#scrHome').classList.contains('on'))renderHome()}).catch(()=>{})})};
 if(!S.player)intro(start);else start()}
boot();

</script>
